apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: k8up
  namespace: flux-system
spec:
  interval: 1h0s
  url: https://k8up-io.github.io/k8up
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8up
spec:
  targetNamespace: ${NAMESPACE}
  chart:
    spec:
      chart: k8up
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: k8up
      version: "4.8.*"
  valuesFrom:
    - kind: ConfigMap
      name: k8up-values
      valuesKey: values.yaml
  interval: 1h0s
