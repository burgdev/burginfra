apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: ${CLUSTER}-openbao-data # 'username' for kopia
  namespace: ${NAMESPACE}
spec:
  sourcePVC: data-openbao-0
  trigger:
    schedule: "*/60 * * * *" # every 60 minutes
    # manual: backup-03
  kopia:
    repository: volsync-kopia-webdav-secrets
    policyConfig:
      configMapName: kopia-policies

    # Overwrite Retention Policy
    retain:
      hourly: 24
      daily: 10
      weekly: 4
      monthly: 1
      yearly: 1

    actions:
      #  beforeSnapshot: |
      #    echo "[Auto] Start at $(date)" >> /data/backup.log

      afterSnapshot: |
        #!/bin/bash
        bash /kopia-config/send-heartbeat.sh -u "${BEAT_OPENBAO_DATA_VOLSYNC}"

    # Use snapshot for point-in-time consistency
    copyMethod: Snapshot

    moverSecurityContext:
      runAsUser: 100
      runAsGroup: 1000
      fsGroup: 1000
