# https://github.com/openbao/openbao-helm/tree/main/charts/openbao
global:
  enabled: true
  tlsDisable: true
  # if enabled:
  #   - https://nanibot.net/posts/vault/
  #   - https://openbao.org/docs/platform/k8s/helm/examples/standalone-tls/
server:
  dev:
    enabled: false
  standalone:
    enabled: true
    # unseal docu: https://openbao.org/docs/configuration/seal/static/
    config: |
      ui = true

      listener "tcp" {
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }

      storage "file" {
        path = "/openbao/data"
      }

      seal "static" {
        current_key_id = "umbrella-1"
        current_key = "file:///keys/unseal-umbrella-1.key"
      }

  volumes:
    - name: openbao-unseal-volume
      secret:
        secretName: openbao-unseal-umbrella-1-key
    - name: certs
      secret:
        secretName: openbao-internal-wildcard-cert-secret
  volumeMounts:
    - mountPath: /keys
      name: openbao-unseal-volume
      readOnly: true
    - mountPath: /certs
      name: certs
      readOnly: true

  dataStorage:
    enabled: true
    storageClass: fast-local-data-v1
  auditStorage:
    enabled: true
    size: 1Gi
    storageClass: fast-local-data-v1

csi:
  enabled: true

ui:
  enabled: true
