apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ${NAMESPACE}
commonLabels:
  app.kubernetes.io/name: openbao
  app.kubernetes.io/component: secrets
  app.kubernetes.io/part-of: infrastructure
  app.kubernetes.io/environment: ${ENVIRONMENT}
  app.kubernetes.io/managed-by: flux
resources:
  - helmrelease.yaml
  - serviceaccount.yaml
  - job-policies.yaml
  # - certificate.yaml # not used
configMapGenerator:
  - name: openbao-values
    files:
      - values.yaml=values.yaml
    options:
      disableNameSuffixHash: true
  - name: openbao-config-script
    files:
      - configure-policies.sh
    options:
      disableNameSuffixHash: true
  - name: openbao-policies
    files:
      - policies/openbao-admin.hcl
      - policies/apps-kv-staging.hcl
      - policies/apps-kv-production.hcl
      - policies/apps-kv-all.hcl
      - policies/infra-kv-staging.hcl
      - policies/infra-kv-system.hcl
      - policies/infra-kv-all.hcl
    options:
      disableNameSuffixHash: true
