apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openbao-ui
  annotations:
    #  cert-manager.io/cluster-issuer: letsencrypt-prod
    #  traefik.ingress.kubernetes.io/router.tls.certresolver: default
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "off"
    nginx.ingress.kubernetes.io/proxy-ssl-name: "openbao"
    nginx.ingress.kubernetes.io/proxy-ssl-secret: "burginfra-system/openbao-internal-wildcard-cert-secret"
spec:
  rules:
    - host: vault.${BURGINFRA_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openbao-ui
                port:
                  number: 8200
  #tls:
  #  - hosts:
  #    - ${DOMAIN}
