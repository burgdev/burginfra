# this is not managed by flux, apply this manuelly!
#
# kubectl apply -k configs/
#
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flux-system
configMapGenerator:
  - name: openbao-config-vars
    envs:
      - .env # copy .env.template to .env
    options:
      disableNameSuffixHash: true

secretGenerator:
  - name: openbao-unseal-umbrella-1-key
    files:
      - unseal-umbrella-1.key=unseal-umbrella-1.key # run: 'openssl rand -out unseal.key 32' to get key
    options:
      disableNameSuffixHash: true
