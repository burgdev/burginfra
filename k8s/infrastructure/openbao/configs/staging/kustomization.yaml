# UNSEAL SECRET for openbao
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: burginfra-system

secretGenerator:
  - name: openbao-unseal-umbrella-1-key
    files:
      - unseal-umbrella-1.key=unseal-umbrella-1.key # run: 'openssl rand -out unseal.key 32' to get key
    options:
      disableNameSuffixHash: true
