apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: tofu-controller
  namespace: flux-system
spec:
  interval: 1h0s
  url: https://flux-iac.github.io/tofu-controller
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tofu-controller
spec:
  chart:
    spec:
      chart: tofu-controller
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: tofu-controller
      version: "0.15.*"
  install:
    createNamespace: false
  values:
    # Runner configuration
    runner:
      serviceAccount:
        create: true
        name: tofu-runner

    # Controller configuration
    replicaCount: 1

    # Resources
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 200m
        memory: 256Mi

  interval: 1h0s
