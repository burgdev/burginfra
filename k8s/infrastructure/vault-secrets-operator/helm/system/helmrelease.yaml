# openbao fork: https://github.com/openbao/openbao-secrets-operator
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: hashicorp
  namespace: flux-system
spec:
  interval: 1h0s
  url: https://helm.releases.hashicorp.com
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault-secrets-operator
spec:
  chart:
    spec:
      chart: vault-secrets-operator
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: hashicorp
      version: "1.x"
  install:
    createNamespace: false
  valuesFrom:
    - kind: ConfigMap
      name: vault-secrets-operator-values
      valuesKey: values.yaml
  interval: 1h0s
