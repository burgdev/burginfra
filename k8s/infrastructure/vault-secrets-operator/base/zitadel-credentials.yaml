# Zitadel Service Admin Credentials for Terraform/Tofu Controller
# This VaultStaticSecret is deployed to all app namespaces via overlays
# It pulls the ZITADEL_ADMIN_JWT from OpenBao and creates a secret for tofu-controller
#
# The JWT is automatically synced to OpenBao by Zitadel's post-install hook
# Storage location: kv/infrastructure/zitadel/burginfra-${ENVIRONMENT}
# Key name: ZITADEL_ADMIN_JWT
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: zitadel-terraform-credentials
spec:
  type: kv-v2
  mount: kv
  # Use infra-kv policy to read from infrastructure path
  vaultAuthRef: infra-kv-${ENVIRONMENT}
  destination:
    name: zitadel-terraform-credentials
    create: true
    transformation:
      excludeRaw: true
      templates:
        # Tofu-controller expects this key name
        zitadel_jwt_profile:
          text: "{{ .Secrets.ZITADEL_ADMIN_JWT }}"
  # Read from the same path where Zitadel secrets are stored
  path: infrastructure/zitadel/burginfra-${ENVIRONMENT}
