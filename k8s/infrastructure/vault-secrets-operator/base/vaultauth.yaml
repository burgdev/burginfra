# VaultAuth resources for OpenBao policies
# Each policy with OPENBAO_ACCESS: kubernetes needs a corresponding VaultAuth resource
# The VaultAuth name and role should match the policy name
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: apps-kv-staging
spec:
  method: kubernetes
  mount: kubernetes
  vaultConnectionRef: openbao-${ENVIRONMENT}
  kubernetes:
    role: apps-kv-staging
    serviceAccount: vault-secrets-operator-controller-manager
---
