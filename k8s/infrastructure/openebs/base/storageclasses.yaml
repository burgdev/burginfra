apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: media
provisioner: local.csi.openebs.io
parameters:
  storageType: lvm
  volgroup: ${VG_NAME:-openebs-vg}
  fsType: xfs
reclaimPolicy: Delete
allowVolumeExpansion: true
mountOptions:
  - noatime
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: data
provisioner: local.csi.openebs.io
parameters:
  storageType: lvm
  volgroup: ${VG_NAME:-openebs-vg}
  fsType: ext4
reclaimPolicy: Delete
allowVolumeExpansion: true
mountOptions:
  - noatime
