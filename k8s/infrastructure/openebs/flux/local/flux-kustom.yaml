# this is used by flux, do not include in any app kustomization.yaml file!
# TODO: add to k8s/flux/*/kustomization.yaml 
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: helm-openebs-local
  namespace: flux-system # do not change!
spec:
  interval: 1h0s
  path: "./k8s/infrastructure/openebs/helm/overlays/local"
  prune: true
  sourceRef: # k8s/clusters/local/flux-system/gotk-sync.yaml
    kind: GitRepository
    name: git-burginfra
  postBuild:
    substitute: # use the same values for all kustomizations
      NAME: "openebs"
      NAMESPACE: "openebs-local"
      ENVIRONMENT: "local"
      REPO_INTERVAL: "1h0s"
      SOURCE_INTERVAL: "1h0s"
      CHART_VERSION: "4.3.*"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-openebs-local
  namespace: flux-system # do not change!
spec:
  interval: 1h0s
  path: "./k8s/infrastructure/openebs/overlays/local"
  dependsOn:
  - name: helm-openebs-local
  prune: true
  sourceRef: # k8s/clusters/local/flux-system/gotk-sync.yaml
    kind: GitRepository
    name: git-burginfra
  postBuild:
    substitute: # use the same values for all kustomizations
      NAME: "openebs"
      NAMESPACE: "openebs-local"
      ENVIRONMENT: "local"
    substituteFrom:
      - kind: ConfigMap 
        name: openebs-config-vars
        optional: true
      
