apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fast-local-data-retain-v2
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: local.csi.openebs.io
parameters:
  storageType: lvm
  volgroup: ${VG_NAME:-openebs-vg}
  thinPoolName: ${THINPOOL_NAME:-openebs-vg_thinpool} # Explicitly specify thin pool name
  fsType: ext4
  shared: yes
  thinProvision: "yes" # Enable thin provisioning for snapshot support
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
mountOptions:
  - noatime
