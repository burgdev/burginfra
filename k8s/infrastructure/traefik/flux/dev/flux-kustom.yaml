# this is used by flux, do not include in any app kustomization.yaml file!
# TODO: add to k8s/flux/*/kustomization.yaml 
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-traefik-dev
  namespace: flux-system # do not change!
#dependsOn:
#- name: base-configs  # optional, only if you have one
spec:
  interval: 1h0s
  path: "./k8s/infrastructure/traefik/overlays/dev"
  prune: true
  sourceRef: # k8s/clusters/local/flux-system/gotk-sync.yaml
    kind: GitRepository
    name: burgdev-burginfra
  postBuild:
    substitute:
      NAMESPACE: "kube-system" # probably not used, kube-system per default
      ENVIRONMENT: "dev"
      EMAIL: "tobias@burgdev.ch"
