# letsencrypt-issuer.yaml
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    email: ${BURGDEV_EMAIL}
    server: https://acme-v02.api.letsencrypt.org/directory
    # privateKeySecretRef:
    #   name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: traefik
