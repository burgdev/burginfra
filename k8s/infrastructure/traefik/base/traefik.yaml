apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    # Preserve real client source IPs: required for the ipAllowList origin
    # lockdown (wd-bunny-allowlist on the wd-frontend-orig ingress). With the
    # default Cluster policy every request appears as a node IP. Single-node
    # cluster: Local has no routing downside. service.spec is the chart's
    # Service-spec passthrough (both keys kept for chart-version tolerance).
    service:
      externalTrafficPolicy: Local
      spec:
        externalTrafficPolicy: Local
    ports:
      web:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
      websecure:
        tls:
          enabled: true
      #web:
      #  exposedPort: 80
      #websecure:
      #  exposedPort: 443
