apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn-ui
  #annotations:
  #  cert-manager.io/cluster-issuer: letsencrypt-prod
  #  traefik.ingress.kubernetes.io/router.tls.certresolver: default
spec:
  rules:
  - host: ${DOMAIN}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: longhorn-ui
            port:
              number: 8000
  tls:
    - hosts:
      - ${DOMAIN}
