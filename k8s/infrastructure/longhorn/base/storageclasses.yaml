# k8s/infrastructure/longhorn/base/storageclass.yaml
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fast-${ENVIRONMENT}
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: driver.longhorn.io
allowVolumeExpansion: true
parameters:
  numberOfReplicas: "1"
  staleReplicaTimeout: "2880" # 48 hours in minutes
  fromBackup: ""
  fsType: "ext4"
---
# ENCRYPTED
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fast-${ENVIRONMENT}-encrypted
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: driver.longhorn.io
allowVolumeExpansion: true
parameters:
  numberOfReplicas: "1"
  staleReplicaTimeout: "2880"
  fromBackup: ""
  fsType: "ext4"
  encrypted: "true"
  # global secret that contains the encryption key that will be used for all volumes
  csi.storage.k8s.io/provisioner-secret-name: "longhorn-encryption-secret"
  csi.storage.k8s.io/provisioner-secret-namespace: "${NAMESPACE}"
  csi.storage.k8s.io/node-publish-secret-name: "longhorn-encryption-secret"
  csi.storage.k8s.io/node-publish-secret-namespace: "${NAMESPACE}"
  csi.storage.k8s.io/node-stage-secret-name: "longhorn-encryption-secret"
  csi.storage.k8s.io/node-stage-secret-namespace: "${NAMESPACE}"
  csi.storage.k8s.io/node-expand-secret-name: "longhorn-encryption-secret"
  csi.storage.k8s.io/node-expand-secret-namespace: "${NAMESPACE}"
