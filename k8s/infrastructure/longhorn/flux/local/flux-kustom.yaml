# this is used by flux, do not include in any app kustomization.yaml file!
# TODO: add to k8s/flux/*/kustomization.yaml 
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-longhorn-local
  namespace: flux-system # do not change!
#dependsOn:
#- name: base-configs  # optional, only if you have one
spec:
  interval: 1h0s
  path: "./k8s/infrastructure/longhorn/overlays/local"
  prune: true
  sourceRef: # k8s/clusters/local/flux-system/gotk-sync.yaml
    kind: GitRepository
    name: git-burginfra
  postBuild:
    substitute:
      NAMESPACE: "longhorn-local"
      ENVIRONMENT: "local"
    substituteFrom:
      - kind: ConfigMap # takes configmap from namespace flux-system
        name: longhorn-ui-config-vars
        optional: true
