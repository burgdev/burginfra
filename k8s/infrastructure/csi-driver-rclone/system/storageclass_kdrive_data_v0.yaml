apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: kdrive-data-v0
provisioner: rclone.csi.veloxpack.io
parameters:
  remote: "kdrive" 
  remotePath: "$${pvc.metadata.namespace}/$${pvc.metadata.name}"
  csi.storage.k8s.io/node-publish-secret-name: "rclone-kdrive-secrets"
  csi.storage.k8s.io/node-publish-secret-namespace: "${NAMESPACE}"
  default-permissions: "true"
  allow-other: "true"
  umask: "0000" # this is needed!
  #dir-perms: "0777"
  #file-perms: "0666"
  vfs-cache-mode: "full"
  dir-cache-time: "12h"
  vfs-read-chunk-size: "32M"
  vfs-read-chunk-size-limit: "2G"
  vfs-read-ahead: "128M"
  vfs-write-back: "5s"
  vfs-cache-poll-interval: "5m"
  vfs-cache-max-size: "5G"
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
