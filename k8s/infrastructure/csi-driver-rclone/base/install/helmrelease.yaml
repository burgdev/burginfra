apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: csi-driver-rclone
  namespace: flux-system
spec:
  type: oci
  interval: 1h0s
  url: oci://ghcr.io/veloxpack/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-rclone
spec:
  targetNamespace: ${NAMESPACE}
  chart:
    spec:
      chart: csi-driver-rclone
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: csi-driver-rclone
      version: "0.2.*"
  valuesFrom:
    - kind: ConfigMap
      name: csi-driver-rclone-values
      valuesKey: values.yaml
  interval: 1h0s
