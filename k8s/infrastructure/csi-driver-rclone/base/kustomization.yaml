apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ${NAMESPACE}
commonLabels:
  app.kubernetes.io/component: csi-driver-rclone
  app.kubernetes.io/part-of: infrastructure
  app.kubernetes.io/environment: ${ENVIRONMENT}
  app.kubernetes.io/managed-by: flux
resources:
  - namespace.yaml
  - secrets.yaml
  - storageclass-kdrive-data-v0.yaml
  - storageclass-kdrive-media-v0.yaml
configMapGenerator:
  - name: csi-driver-rclone-values
    files:
      - values.yaml=values.yaml
generatorOptions:
  disableNameSuffixHash: true
