# https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
crds:
  enabled: true
customRules: {}
  # AlertmanagerFailedReload:
  #   for: 3m
  # AlertmanagerMembersInconsistent:
  #   for: 5m
  #   severity: "warning"
 
## Deploy a Prometheus instance
prometheus:
  enabled: true
  prometheusSpec:
    # Retention settings
    retention: 7d
    retentionSize: "5GiB"
    
    # Resource requests and limits
    resources:
      requests:
        memory: 1Gi
        cpu: 200m
      limits:
        memory: 2Gi
        cpu: 800m
    
    # Storage configuration
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: fast-local-data
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi  # Increased for better retention
    
grafana:
  persistence:
     enabled: true
     type: sts
     storageClassName: "fast-local-data"
     accessModes:
       - ReadWriteOnce
     size: 2Gi
     finalizers:
       - kubernetes.io/pvc-protection