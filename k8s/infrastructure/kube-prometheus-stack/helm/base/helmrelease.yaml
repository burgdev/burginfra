apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ${NAME}
  namespace: flux-system
spec:
  type: oci
  interval: 1h0s
  url: oci://ghcr.io/prometheus-community/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${NAME}
spec:
  targetNamespace: ${NAMESPACE}
  chart:
    spec:
      chart: ${NAME}
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: ${NAME}
      version: "79.1.*"
  valuesFrom:
    - kind: ConfigMap
      name: ${NAME}-values
      valuesKey: values.yaml
  interval: 1h0s
