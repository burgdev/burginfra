# this is used by flux, do not include in any app kustomization.yaml file!
# TODO: add to k8s/flux/*/kustomization.yaml 
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: helm-kube-prometheus-stack-local
  namespace: flux-system # do not change!
spec:
  interval: 1h0s
  path: "./k8s/infrastructure/kube-prometheus-stack/helm/overlays/local"
  prune: true
  sourceRef: # k8s/clusters/local/flux-system/gotk-sync.yaml
    kind: GitRepository
    name: burgdev-burginfra
  postBuild:
    substitute: # use the same values for all kustomizations
      NAME: "kube-prometheus-stack"
      NAMESPACE: "monitoring"
      ENVIRONMENT: "local"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-kube-prometheus-stack-local
  namespace: flux-system # do not change!
spec:
  interval: 1h0s
  path: "./k8s/infrastructure/kube-prometheus-stack/helm/overlays/local"
  prune: true
  dependsOn:
  - name: helm-kube-prometheus-stack-local
  sourceRef: # k8s/clusters/local/flux-system/gotk-sync.yaml
    kind: GitRepository
    name: burgdev-burginfra
  postBuild:
    substitute:
      NAME: "kube-prometheus-stack"
      NAMESPACE: "monitoring"
      ENVIRONMENT: "local"
    substituteFrom:
      - kind: ConfigMap
        name: kube-prometheus-stack-config-vars
        optional: false
      
