apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: zitadel-postgres-superuser
spec:
  type: kv-v2
  mount: kv
  vaultAuthRef: infra-kv-${ENVIRONMENT}
  destination:
    name: zitadel-postgres-superuser
    create: true
    type: kubernetes.io/basic-auth
    transformation:
      excludeRaw: true
      templates:
        username:
          text: "postgres"
        password:
          text: "{{ .Secrets.ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD }}"
  path: infrastructure/zitadel/${NAMESPACE}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: zitadel-postgres-credentials
spec:
  type: kv-v2
  mount: kv
  vaultAuthRef: infra-kv-${ENVIRONMENT}
  destination:
    name: zitadel-postgres-credentials
    create: true
    type: kubernetes.io/basic-auth
    transformation:
      excludeRaw: true
      templates:
        username:
          text: "zitadel"
        password:
          text: "{{ .Secrets.ZITADEL_DATABASE_POSTGRES_USER_PASSWORD }}"
  path: infrastructure/zitadel/${NAMESPACE}
