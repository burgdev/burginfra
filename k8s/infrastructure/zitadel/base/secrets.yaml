apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: zitadel-masterkey
spec:
  type: kv-v2
  mount: kv
  vaultAuthRef: infra-kv-${ENVIRONMENT}
  destination:
    name: zitadel-masterkey
    create: true
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        masterkey:
          text: "{{ .Secrets.ZITADEL_MASTERKEY }}"
  path: infrastructure/zitadel/${NAMESPACE}
