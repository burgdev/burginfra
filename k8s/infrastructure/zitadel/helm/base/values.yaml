# https://artifacthub.io/packages/helm/zitadel/zitadel
# Default valus: https://github.com/zitadel/zitadel/blob/main/cmd/defaults.yaml
zitadel:
  masterkeySecretName: zitadel-masterkey

  configmapConfig:
    #ExternalDomain: auth.staging.${BURGDEV_HOST}
    ExternalDomain: pg-insecure.127.0.0.1.sslip.io
    ExternalPort: 443
    ExternalSecure: true

    TLS:
      Enabled: false # TLS termination handled by Traefik

    Database:
      Postgres:
        Host: zitadel-postgres-rw # CloudNativePG read-write service
        # Admin and USer name is set by the 'zitadel-envvars' secret.
        # The same credentials are used.
        Admin:
          #ExistingDatabase: zitadel
          SSL:
            Mode: disable
        User:
          SSL:
            Mode: disable

  #FirstInstance:
  #  Org:
  #    Human:
  #      # use the loginname root@zitadel.localhost
  #      Username: "root"
  #      Password: "RootPassword1!"

envVarsSecret: "zitadel-envvars"
# Env vars for init job (some chart versions need these at top level)
env:
  - name: ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: zitadel-postgres-superuser
        key: password
  - name: ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME
    valueFrom:
      secretKeyRef:
        name: zitadel-postgres-superuser
        key: username
  - name: ZITADEL_DATABASE_POSTGRES_USER_PASSWORD
    valueFrom:
      secretKeyRef:
        name: zitadel-postgres-app
        key: password
  - name: ZITADEL_DATABASE_POSTGRES_USER_USERNAME
    valueFrom:
      secretKeyRef:
        name: zitadel-postgres-app
        key: username

# Enable ingress
ingress:
  enabled: true
  className: traefik
  #annotations:
  #  cert-manager.io/cluster-issuer: letsencrypt-prod
  #hosts:
  #  - host: auth.staging.${BURGDEV_HOST}
  #    paths:
  #      - path: /
  #        pathType: Prefix
  #tls:
  #  - secretName: zitadel-tls
  #    hosts:
  #      - auth.staging.${BURGDEV_HOST}

# Login UI ingress - Disabled as Zitadel v4+ has login built-in
# The login UI is served by the main Zitadel application at /ui/v2/login/
login:
  ingress:
    enabled: true
    className: traefik
