# Zitadel Helm Chart Values
# https://github.com/zitadel/zitadel-charts
zitadel:
  masterkeySecretName: zitadel-masterkey

  # Init container to wait for PostgreSQL to be ready
  initContainers:
    - name: wait-for-db
      image: postgres:16-alpine
      command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "Waiting for PostgreSQL to be ready..."

          # Wait for service to respond
          until pg_isready -h zitadel-postgres-rw -p 5432 -U zitadel 2>&1; do
            echo "PostgreSQL service is unavailable - waiting..."
            sleep 2
          done
          echo "PostgreSQL service is ready!"

          # Give PostgreSQL a moment to fully accept connections
          sleep 3
          echo "PostgreSQL init container complete!"

  configmapConfig:
    ExternalDomain: iam.staging.${BURGDEV_HOST}
    ExternalPort: 443
    ExternalSecure: true

    TLS:
      Enabled: false # TLS termination handled by Traefik

    Database:
      Postgres:
        Host: zitadel-postgres-rw # CloudNativePG read-write service
        Port: 5432
        Database: zitadel
        Admin:
          Username: zitadel
          ExistingDatabase: zitadel
          SSL:
            Mode: disable
        User:
          Username: zitadel
          SSL:
            Mode: disable

#envVarsSecret: "zitadel-envvars"
# Env vars for init job (some chart versions need these at top level)
env:
  - name: ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: zitadel-postgres-credentials
        key: password
  - name: ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME
    valueFrom:
      secretKeyRef:
        name: zitadel-postgres-credentials
        key: username
  - name: ZITADEL_DATABASE_POSTGRES_USER_PASSWORD
    valueFrom:
      secretKeyRef:
        name: zitadel-postgres-credentials
        key: password
  - name: ZITADEL_DATABASE_POSTGRES_USER_USERNAME
    valueFrom:
      secretKeyRef:
        name: zitadel-postgres-credentials
        key: username
  - name: ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: zitadel-firstinstance-credentials
        key: password
  - name: ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME
    valueFrom:
      secretKeyRef:
        name: zitadel-firstinstance-credentials
        key: username

# Disable bundled PostgreSQL - using CloudNativePG instead
postgresql:
  enabled: false

# Enable ingress
ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: iam.staging.${BURGDEV_HOST}
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: zitadel-tls
      hosts:
        - iam.staging.${BURGDEV_HOST}

# Login UI ingress
login:
  enabled: true
  ingress:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: iam.staging.${BURGDEV_HOST}
        paths:
          - path: /login
            pathType: Prefix
    tls:
      - secretName: zitadel-login-tls
        hosts:
          - iam.staging.${BURGDEV_HOST}
