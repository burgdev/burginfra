# VolSync backup configuration for CloudNativePG PostgreSQL databases
#
# This configuration provides:
# - SQL dumps (logical backup) for easy restore/portability
# - PVC snapshots (physical backup) for full recovery
# - PostgreSQL CHECKPOINT before snapshot for consistency
# - Validation and heartbeat monitoring
#
# To adapt for other databases:
# 1. Update the configuration section in beforeSnapshot (lines ~99-113)
# 2. All configuration is automatically shared with afterSnapshot via /tmp/backup-config.env
# 3. No need to modify afterSnapshot script
#
# TODO: move pvc and tool job to volsync (infra)
#       see podinfo backup_manual.yaml file!
---
# ServiceAccount for volsync mover with minimal RBAC permissions
apiVersion: v1
kind: ServiceAccount
metadata:
  name: volsync-zitadel-mover
  namespace: ${NAMESPACE}
---
# Role with minimal permissions - exec into postgres pod and read secrets
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: volsync-zitadel-mover
  namespace: ${NAMESPACE}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["volsync.backube"]
    resources: ["replicationsources"]
    verbs: ["get"]
    resourceNames: ["${CLUSTER}-zitadel-postgres"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: volsync-zitadel-mover
  namespace: ${NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: volsync-zitadel-mover
subjects:
  - kind: ServiceAccount
    name: volsync-zitadel-mover
    namespace: ${NAMESPACE}
---
# docu from fork: https://perfectra1n.github.io/volsync/usage/kopia/index.html#
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: ${CLUSTER}-zitadel-postgres # 'username' for kopia
  namespace: ${NAMESPACE}
spec:
  sourcePVC: zitadel-postgres-1
  trigger:
    #schedule: "0 4 * * *" # Daily at 4 AM (low activity period)
    manual: backup-init
  kopia:
    repository: volsync-kopia-webdav-secrets
    policyConfig:
      configMapName: kopia-policies

    # Use custom ServiceAccount with limited RBAC
    moverServiceAccount: volsync-zitadel-mover

    # TODO: Use moverVolumes once available (waiting for https://github.com/perfectra1n/volsync/pull/25)
    #       Then it is also possible to use config maps for the scripts
    #       See podinfo backup_manual.yaml file!!
    # moverVolumes:
    #   - mountPath: tools # Mounts to /mnt/tools in the mover pod
    #     volumeSource:
    #       persistentVolumeClaim:
    #         claimName: volsync-tools

    # Overwrite Retention Policy
    retain:
      hourly: 72
      daily: 7
      weekly: 4
      monthly: 6
      yearly: 1

    # Application consistency hooks
    actions:
      beforeSnapshot: |
        #!/bin/sh
        set -e

        # ============================================================================
        # Configuration - Customize these variables for different databases
        # ============================================================================
        cat > /tmp/backup-config.env <<'EOF'
        NAMESPACE="${NAMESPACE}"
        CNPG_CLUSTER_NAME="zitadel-postgres"
        DB_NAME="zitadel"
        DB_USER="postgres"
        BACKUP_FILENAME="backup.sql"
        DUMP_TIMEOUT=600
        KUBECTL_VERSION="v1.33.7"
        MIN_DUMP_SIZE=1024
        PG_DUMP_COMMAND="pg_dump"
        PG_DUMP_ARGS="--clean --if-exists --no-owner --no-privileges"
        HEARTBEAT_URL="${BEAT_ZITADEL_POSTGRES_VOLSYNC}"
        REPLICATION_SOURCE_NAME="${CLUSTER}-zitadel-postgres"
        MAX_DUMP_AGE=600
        EOF

        # Source configuration
        . /tmp/backup-config.env

        # ============================================================================
        # Backup Script - No changes needed below this line
        # ============================================================================
        echo "==> [$(date)] PostgreSQL backup starting for $CNPG_CLUSTER_NAME..."

        # Download kubectl to /cache (persists across backups, not included in snapshot)
        KUBECTL=/cache/.volsync-tools/kubectl
        if [ ! -f "$KUBECTL" ]; then
          echo "==> Downloading kubectl (first run only)..."
          mkdir -p /cache/.volsync-tools
          curl -sL https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl -o "$KUBECTL"
          chmod +x "$KUBECTL"
          echo "==> kubectl downloaded and cached"
        fi

        BACKUP_FILE="/data/$BACKUP_FILENAME"

        # Find postgres pod dynamically
        echo "==> Finding postgres pod..."
        POSTGRES_POD=$($KUBECTL get pods -n "$NAMESPACE" -l cnpg.io/cluster=${CNPG_CLUSTER_NAME} -o jsonpath='{.items[0].metadata.name}')
        if [ -z "$POSTGRES_POD" ]; then
          echo "ERROR: Could not find pod for cluster: ${CNPG_CLUSTER_NAME}"
          exit 1
        fi
        echo "==> Found postgres pod: $POSTGRES_POD"
        echo "==> Database: $DB_NAME, User: $DB_USER"

        # Delete old backup file if it exists
        if [ -f "$BACKUP_FILE" ]; then
          echo "==> Removing old backup file..."
          rm -f "$BACKUP_FILE"
        fi

        # Create SQL dump inside postgres container (using PGDATA env var for path)
        # Use superuser with Unix socket (no password needed, peer auth)
        echo "==> Creating SQL dump with $PG_DUMP_COMMAND (timeout: ${DUMP_TIMEOUT}s)..."
        DUMP_START=$(date +%s)

        # Build dump command based on PG_DUMP_COMMAND
        if [ "$PG_DUMP_COMMAND" = "pg_dumpall" ]; then
          # pg_dumpall doesn't take -d flag, dumps all databases
          DUMP_CMD="$PG_DUMP_COMMAND -U \"$DB_USER\" $PG_DUMP_ARGS -f \"\$PGDATA/$BACKUP_FILENAME\""
        else
          # pg_dump requires -d flag for database name
          DUMP_CMD="$PG_DUMP_COMMAND -U \"$DB_USER\" -d \"$DB_NAME\" $PG_DUMP_ARGS -f \"\$PGDATA/$BACKUP_FILENAME\""
        fi

        $KUBECTL exec -n "$NAMESPACE" "$POSTGRES_POD" -c postgres -- \
          timeout $DUMP_TIMEOUT sh -c "$DUMP_CMD"

        DUMP_EXIT_CODE=$?
        DUMP_END=$(date +%s)
        DUMP_DURATION=$((DUMP_END - DUMP_START))

        if [ $DUMP_EXIT_CODE -ne 0 ]; then
          echo "ERROR: pg_dump failed with exit code $DUMP_EXIT_CODE"
          exit 1
        fi
        echo "==> SQL dump completed in ${DUMP_DURATION}s"

        # Verify dump file was created
        if [ ! -f "$BACKUP_FILE" ]; then
          echo "ERROR: Backup file was not created at $BACKUP_FILE"
          exit 1
        fi

        # Verify dump file size
        DUMP_SIZE=$(stat -c%s "$BACKUP_FILE" 2>/dev/null || echo 0)
        if [ "$DUMP_SIZE" -lt $MIN_DUMP_SIZE ]; then
          echo "ERROR: Backup file too small ($DUMP_SIZE bytes < $MIN_DUMP_SIZE bytes), likely corrupted"
          exit 1
        fi
        echo "==> Backup file created: $(numfmt --to=iec-i --suffix=B $DUMP_SIZE)"

        # Issue CHECKPOINT to ensure PostgreSQL buffers are flushed to disk
        echo "==> Issuing PostgreSQL CHECKPOINT..."
        $KUBECTL exec -n "$NAMESPACE" "$POSTGRES_POD" -c postgres -- \
          psql -U postgres -c "CHECKPOINT;"
        echo "==> CHECKPOINT completed - database is ready for snapshot"

        # Store metadata for post-snapshot validation
        echo "$DUMP_START" > /tmp/dump-timestamp
        echo "$DUMP_SIZE" > /tmp/dump-size

        echo "==> Pre-backup complete - ready for PVC snapshot"

      afterSnapshot: |
        #!/bin/sh
        # Note: Continue even if validation fails to send error heartbeat
        set +e

        # Load configuration from beforeSnapshot
        if [ ! -f /tmp/backup-config.env ]; then
          echo "ERROR: Configuration file /tmp/backup-config.env not found"
          exit 1
        fi
        . /tmp/backup-config.env

        # ============================================================================
        # Validation Script - No changes needed below this line
        # ============================================================================
        echo "==> [$(date)] Post-backup validation starting for $CNPG_CLUSTER_NAME..."

        KUBECTL=/cache/.volsync-tools/kubectl
        BACKUP_FILE="/data/$BACKUP_FILENAME"

        VALIDATION_FAILED=0
        ERROR_MSG=""

        # Validate SQL dump exists
        if [ ! -f "$BACKUP_FILE" ]; then
          echo "ERROR: Backup file not found at $BACKUP_FILE"
          ERROR_MSG="Backup file not found"
          VALIDATION_FAILED=1
        fi

        # Validate dump file size
        if [ $VALIDATION_FAILED -eq 0 ]; then
          DUMP_SIZE=$(stat -c%s "$BACKUP_FILE" 2>/dev/null || echo 0)
          if [ "$DUMP_SIZE" -lt $MIN_DUMP_SIZE ]; then
            echo "ERROR: Backup file too small ($DUMP_SIZE bytes)"
            ERROR_MSG="Backup file too small: $DUMP_SIZE bytes"
            VALIDATION_FAILED=1
          else
            echo "==> Backup file size: $(numfmt --to=iec-i --suffix=B $DUMP_SIZE)"
          fi
        fi

        # Validate dump file age (created during this backup run)
        if [ $VALIDATION_FAILED -eq 0 ]; then
          CURRENT_TIME=$(date +%s)
          DUMP_MTIME=$(stat -c%Y "$BACKUP_FILE" 2>/dev/null || echo 0)
          DUMP_AGE=$((CURRENT_TIME - DUMP_MTIME))

          if [ $DUMP_AGE -gt $MAX_DUMP_AGE ]; then
            echo "ERROR: Backup file is too old ($DUMP_AGE seconds)"
            ERROR_MSG="Backup file is stale: $DUMP_AGE seconds old"
            VALIDATION_FAILED=1
          else
            echo "==> Backup file age: ${DUMP_AGE}s (recent)"
          fi
        fi

        # Validate VolSync ReplicationSource status
        if [ $VALIDATION_FAILED -eq 0 ]; then
          echo "==> Checking VolSync backup status..."
          REPLICATION_STATUS=$($KUBECTL get replicationsource "$REPLICATION_SOURCE_NAME" -n "$NAMESPACE" -o jsonpath='{.status.lastSyncTime}' 2>/dev/null || echo "")

          if [ -z "$REPLICATION_STATUS" ]; then
            echo "WARNING: Could not retrieve ReplicationSource status"
            # Don't fail on this - might be transient
          else
            echo "==> Last sync time: $REPLICATION_STATUS"
          fi
        fi

        # Send heartbeat based on validation result (if HEARTBEAT_URL is configured)
        if [ -n "$HEARTBEAT_URL" ]; then
          if [ $VALIDATION_FAILED -eq 0 ]; then
            echo "==> All validation checks passed - sending success heartbeat..."
            if curl -fsS -m 10 "$HEARTBEAT_URL" >/dev/null 2>&1; then
              echo "==> Success heartbeat sent"
            else
              echo "WARNING: Failed to send success heartbeat (curl failed)"
            fi
          else
            echo "==> Validation failed - sending error heartbeat..."
            if curl -fsS -m 10 "${HEARTBEAT_URL}/fail" >/dev/null 2>&1; then
              echo "==> Error heartbeat sent: $ERROR_MSG"
            else
              echo "ERROR: Failed to send error heartbeat (curl failed)"
            fi
          fi
        else
          echo "==> No heartbeat URL configured, skipping heartbeat"
        fi

        # Log backup result to data volume
        if [ $VALIDATION_FAILED -eq 0 ]; then
          echo "[$(date)] Backup completed successfully - size: $(numfmt --to=iec-i --suffix=B $DUMP_SIZE)" >> /data/backup.log
        else
          echo "[$(date)] Backup FAILED - $ERROR_MSG" >> /data/backup.log
        fi

        # Cleanup old logs (keep last 100 lines)
        if [ -f /data/backup.log ]; then
          tail -n 100 /data/backup.log > /data/backup.log.tmp
          mv /data/backup.log.tmp /data/backup.log
        fi

        echo "==> Post-backup complete"
        exit 0  # Always exit 0 to not fail the VolSync job

    copyMethod: Snapshot
