apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: ${CLUSTER}-zitadel-postgres # 'username' for kopia
  namespace: ${NAMESPACE}
spec:
  sourcePVC: zitadel-postgres-1
  trigger:
    schedule: "*/60 * * * *" # every 60 minutes
    #manual: backup-01
  kopia:
    repository: volsync-kopia-webdav-secrets
    policyConfig:
      configMapName: kopia-policies

    # Overwrite Retention Policy
    retain:
      hourly: 24
      daily: 10
      weekly: 4
      monthly: 1
      yearly: 1

    #actions:
    #  beforeSnapshot: |
    #    echo "[Auto] Start at $(date)" >> /data/backup.log

    #  afterSnapshot: |
    #    echo "[Auto] Finished at $(date)" >> /data/backup.log

    # Use snapshot for point-in-time consistency
    # Snapshot is not supported yet https://github.com/openebs/openebs/issues/4071
    # copyMethod: Snapshot
    copyMethod: Direct

    moverSecurityContext:
      runAsUser: 26
      runAsGroup: 26
      fsGroup: 26
