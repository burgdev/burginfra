apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ${NAMESPACE}

resources:
  - pvc.yaml
  - job-initialize.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

configMapGenerator:
  - name: graphhopper-config
    files:
      - config.yml
    options:
      disableNameSuffixHash: true

commonLabels:
  app: graphhopper
