apiVersion: batch/v1
kind: Job
metadata:
  name: graphhopper-initialize
  namespace: ${NAMESPACE}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        job-name: graphhopper-initialize
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        runAsNonRoot: true

      containers:
        - name: build-graph
          image: ghcr.io/simonneutert/graphhopper:11.0
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: JAVA_OPTS
              value: ${GRAPHOPPER_BUILD_MEMORY}
          args:
            - --import
            - -c
            - /data/config.yml
          volumeMounts:
            - name: osm-data
              mountPath: /osm_data
              readOnly: true
            - name: gtfs-data
              mountPath: /gtfs_data
              readOnly: true
            - name: graph-data
              mountPath: /data
            - name: srtm-cache
              mountPath: /srtm_cache
            - name: config
              mountPath: /data/config.yml
              subPath: config.yml
          resources:
            requests:
              cpu: ${GRAPHOPPER_BUILD_CPU}
              memory: ${GRAPHOPPER_BUILD_MEMORY}
            limits:
              memory: ${GRAPHOPPER_BUILD_MEMORY}

      volumes:
        - name: osm-data
          persistentVolumeClaim:
            claimName: map-data-osm
            readOnly: true
        - name: gtfs-data
          persistentVolumeClaim:
            claimName: map-data-gtfs
            readOnly: true
        - name: graph-data
          persistentVolumeClaim:
            claimName: graphhopper-data
        - name: srtm-cache
          persistentVolumeClaim:
            claimName: graphhopper-srtm-cache
        - name: config
          configMap:
            name: graphhopper-config
