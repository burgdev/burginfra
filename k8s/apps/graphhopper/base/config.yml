graphhopper:
  # Data reader configuration
  datareader.file: /osm_data/switzerland-latest.osm.pbf
  import_vehicle: all

  # Graph location
  graph.location: /data/.gh

  # Profiles to build (testing only foot and hiking)
  profiles:
    - name: foot
      custom_model_files: [foot.json, foot_elevation.json]
    - name: hiking
      custom_model_files: [foot.json, foot_elevation.json]

  # Contraction Hierarchies (disabled for testing)
  profiles_ch: []

  # Landmarks (alternative to CH, disabled for now)
  profiles_lm: []

  # Server configuration
  server:
    application_connectors:
      - type: http
        port: 8989
        bind_host: 0.0.0.0
    admin_connectors:
      - type: http
        port: 8990
        bind_host: localhost
    request_log:
      appenders: []

  # Data access
  graph.dataaccess: RAM_STORE

  # Elevation (using SRTM)
  graph.elevation.provider: srtm
  graph.elevation.cache_dir: /srtm_cache

  # Logging
  logging:
  appenders:
    - type: console
      log_format: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  loggers:
    "com.graphhopper.osm_warnings":
      level: INFO
