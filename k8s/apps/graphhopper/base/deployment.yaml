apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphhopper
  namespace: ${NAMESPACE}
spec:
  replicas: ${GRAPHOPPER_REPLICAS}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: graphhopper
  template:
    metadata:
      labels:
        app: graphhopper
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        runAsNonRoot: true

      containers:
        - name: graphhopper
          image: ghcr.io/simonneutert/graphhopper:11.0
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 8989
              protocol: TCP
          env:
            - name: JAVA_OPTS
              value: "-Xmx3g -Xms2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
          command:
            - /graphhopper.sh
            - -c
            - /data/config.yml
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              cpu: 250m
              memory: 2Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: osm-data
              mountPath: /osm_data
              readOnly: true
            - name: gtfs-data
              mountPath: /gtfs_data
              readOnly: true
            - name: graph-data
              mountPath: /data
            - name: srtm-cache
              mountPath: /srtm_cache

      volumes:
        - name: osm-data
          persistentVolumeClaim:
            claimName: map-data-osm
            readOnly: true
        - name: gtfs-data
          persistentVolumeClaim:
            claimName: map-data-gtfs
            readOnly: true
        - name: graph-data
          persistentVolumeClaim:
            claimName: graphhopper-data
        - name: srtm-cache
          emptyDir:
            sizeLimit: 2Gi
