---
# docu from fork: https://perfectra1n.github.io/volsync/usage/kopia/index.html#
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: podinfo-data-direct # 'username' for kopia
  #namespace: ${NAMESPACE}
  namespace: podinfo-image-local
spec:
  sourcePVC: fast-data-pvc-v1
  trigger:
    schedule: "*/5 * * * *"
    #manual: backup-03
  kopia:
    repository: volsync-kopia-webdav-secrets
    policyConfig:
      configMapName: kopia-policies

    # Overwrite Retention Policy
    retain:
      hourly: 24
      daily: 2
      weekly: 2
      monthly: 1
      yearly: 0

    # Database Consistency Actions
    # These hooks ensure database consistency during backup
    actions:
      # Before snapshot: Create consistent database dump
      beforeSnapshot: |
        echo "Starting database backup at $(date)" >> /data/backup.log
        # mysqldump --single-transaction --routines --triggers --all-databases > /data/mysql-backup.sql
        sleep 3
        echo "Database dump completed" >> /data/backup.log

      # After snapshot: Clean up temporary files
      afterSnapshot: |
        # rm -f /data/mysql-backup.sql
        echo "Cleanup completed at $(date)" >> /data/backup.log

    # Use clone for point-in-time consistency
    # copyMethod: Snapshot
    copyMethod: Direct

