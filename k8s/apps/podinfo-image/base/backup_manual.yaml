---
# docu from fork: https://perfectra1n.github.io/volsync/usage/kopia/index.html#
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: podinfo-data-manual # 'username' for kopia
  #namespace: ${NAMESPACE}
  namespace: podinfo-image-local
spec:
  sourcePVC: fast-data-pvc-v1
  trigger:
    #schedule: "*/2 * * * *"
    manual: backup-05
  kopia:
    repository: volsync-kopia-webdav-secrets
    policyConfig:
      configMapName: kopia-policies

    # Overwrite Retention Policy
    retain:
      hourly: 72
      daily: 7
      weekly: 4
      monthly: 6
      yearly: 1

    # Database Consistency Actions
    # These hooks ensure database consistency during backup
    actions:
      # Before snapshot: Create consistent database dump
      beforeSnapshot: |
        echo "[Manual] $(date)" >> /data/backup.log
        echo "[Manual] Backup from $(uname -r)" >> /data/backup.log

      # After snapshot: Clean up temporary files
      afterSnapshot: |
        echo "[Manual] Cleanup completed at $(date)" >> /data/backup.log

    # Use clone for point-in-time consistency
    copyMethod: Snapshot
    # copyMethod: Direct

