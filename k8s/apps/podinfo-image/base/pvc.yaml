apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: podinfo-image-fast-local-data-pvc
  annotations:
    k8up.io/backup: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-local-data
  resources:
    requests:
      storage: 50Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: podinfo-image-remote-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: kdrive-data-v0
  resources:
    requests:
      storage: 50Mi