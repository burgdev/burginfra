apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fast-data-pvc-v0
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-local-data
  resources:
    requests:
      storage: 50Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fast-media-pvc-v0
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-local-media
  resources:
    requests:
      storage: 350MB
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: remote-data-pvc-v0
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: kdrive-data-v0
  resources:
    requests:
      storage: 50Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: remote-media-pvc-v0 # update deployment.yaml
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: kdrive-media-v0 # update metadata.name
  resources:
    requests:
      storage: 50Mi