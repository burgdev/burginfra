apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: immich
  namespace: ${NAMESPACE}
spec:
  interval: 1h0s
  url: https://immich-app.github.io/immich-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  chart:
    spec:
      chart: immich
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: immich
      version: "0.10.x"
  install:
    createNamespace: false
  valuesFrom:
    - kind: ConfigMap
      name: immich-values
      valuesKey: values.yaml
  interval: 1h0s
