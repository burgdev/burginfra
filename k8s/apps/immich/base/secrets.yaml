apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: immich-${NAMESPACE}-config-secret
  namespace: flux-system
spec:
  type: kv-v2
  mount: kv
  vaultAuthRef: apps-kv-${NAMESPACE} # either default or staging
  #vaultAuthRef: apps-kv-all # either default or staging
  destination:
    name: immich-${NAMESPACE}-config-secret # the name of the K8s Secret
    create: true
    transformation:
      excludeRaw: true # exclue _raw field
  path: apps/immich/${NAMESPACE} # OpenBao KV path

