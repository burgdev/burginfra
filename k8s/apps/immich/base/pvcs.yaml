# PRESISTEND VOLUME CLAIM DATA ====
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library-pvc-v0
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: ${IMMICH_LIBRARY_STORAGE_SIZE:-5Gi}
  storageClassName: fast-local-media-retain-v2
---
# PRESISTEND VOLUME CLAIM EXTERNAL ====
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-external-pvc-v0
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: ${IMMICH_EXTERNAL_STORAGE_SIZE:-5Gi}
  storageClassName: fast-local-media-retain-v2
