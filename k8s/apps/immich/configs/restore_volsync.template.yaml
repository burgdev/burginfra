# IMMICH LIBRARY - volsync
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: ${CLUSTER}-immich-library # 'username' for kopia
  namespace: ${NAMESPACE}
spec:
  trigger:
    manual: restore-immich-library-${TIMESTAMP}
  kopia:
    #repository: volsync-kopia-webdav-secrets
    # ONLY for immich current backup
    repository: volsync-immich-kopia-webdav-secrets
    username: "burg"
    hostname: "infra"
    # ~~~~~~

    destinationPVC: immich-library-pvc-v2
    copyMethod: Direct
    enableFileDeletion: false

    # Cache configuration to avoid emptyDir on root filesystem
    cacheCapacity: 50Gi
    cacheAccessModes:
      - ReadWriteOnce
    # cacheStorageClassName # use default storage class

    sourceIdentity:
      sourceName: ${SRC_CLUSTER}-immich-library
      sourceNamespace: ${SRC_NAMESPACE}
      #sourcePathOverride: "/mnt/kubernetes/volumes/immich/server/data"
      #sourcePathOverride: "/data"

    moverSecurityContext:
      runAsUser: 0 # root
      runAsGroup: 0 # root
      fsGroup: 0
---
