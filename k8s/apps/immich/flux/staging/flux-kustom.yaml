apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-immich-staging
  namespace: flux-system # do not change!
spec:
  interval: 3h0s
  path: "./k8s/apps/immich/overlays/staging"
  prune: false
  dependsOn:
    - name: apps-sync-all-staging
  sourceRef: # k8s/clusters/local/flux-system/gotk-sync.yaml
    kind: GitRepository
    name: burgdev-burginfra
  postBuild:
    substitute:
      NAMESPACE: "staging"
      ENVIRONMENT: "staging"
    substituteFrom:
      - kind: ConfigMap # takes configmap from namespace flux-system
        name: cluster-settings
      - kind: Secret
        name: immich-staging-config-secret
