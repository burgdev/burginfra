apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-immich-production
  namespace: flux-system # do not change!
spec:
  interval: 3h0s
  path: "./k8s/apps/immich/overlays/production"
  prune: false
  dependsOn:
    - name: apps-sync-all-production
  sourceRef: # k8s/clusters/local/flux-system/gotk-sync.yaml
    kind: GitRepository
    name: burgdev-burginfra
  postBuild:
    substitute:
      NAMESPACE: "production"
      ENVIRONMENT: "prod"
      ENV_SUBDOMAIN: ""
    substituteFrom:
      - kind: ConfigMap # takes configmap from namespace flux-system
        name: cluster-settings
      - kind: Secret
        name: immich-production-config-secret
