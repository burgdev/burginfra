apiVersion: batch/v1
kind: Job
metadata:
  name: valhalla-download
  namespace: ${NAMESPACE}
spec:
  backoffLimit: 0 # Don't retry, keep failed pod for debugging
  ttlSecondsAfterFinished: 86400 # Keep for 24h for debugging
  template:
    metadata:
      labels:
        app: valhalla
        job: download
    spec:
      restartPolicy: Never # Don't restart, keep failed containers for inspection
      securityContext:
        fsGroup: 1000 # Files created will be owned by group 1000
        fsGroupChangePolicy: "OnRootMismatch"
      initContainers:
        # 1. Download and merge OSM PBF files
        - name: download-osm
          image: debian:12-slim
          command: ["/bin/bash", "/scripts/download-osm.sh"]
          env:
            - name: VALHALLA_INIT_JOB
              value: ${VALHALLA_INIT_JOB}
            - name: OSM_URLS
              value: ${VALHALLA_OSM_URLS}
            - name: ERROR_SLEEP
              value: "180"
            - name: FINISH_SLEEP
              value: "60"
          volumeMounts:
            - name: data
              mountPath: /custom_files
            - name: gtfs-feeds-data
              mountPath: /gtfs_feeds
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi # For merging large regions

        # 2. Download GTFS transit data
        - name: download-gtfs
          image: debian:12-slim
          command: ["/bin/bash", "/scripts/download-gtfs.sh"]
          env:
            - name: VALHALLA_INIT_JOB
              value: ${VALHALLA_INIT_JOB}
            - name: GTFS_URLS
              value: ${VALHALLA_GTFS_URLS}
            - name: ERROR_SLEEP
              value: "180"
            - name: FINISH_SLEEP
              value: "60"
          volumeMounts:
            - name: data
              mountPath: /custom_files
            - name: gtfs-feeds-data
              mountPath: /gtfs_feeds
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi

        # 3. Download elevation data
        - name: download-elevation
          image: debian:12-slim
          command: ["/bin/bash", "/scripts/download-elevation.sh"]
          env:
            - name: VALHALLA_INIT_JOB
              value: ${VALHALLA_INIT_JOB}
            - name: ELEVATION_BOUNDS
              value: ${VALHALLA_ELEVATION_BOUNDS}
            - name: ERROR_SLEEP
              value: "180"
            - name: FINISH_SLEEP
              value: "60"
          volumeMounts:
            - name: data
              mountPath: /custom_files
            - name: gtfs-feeds-data
              mountPath: /gtfs_feeds
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi

      containers:
        - name: complete
          image: debian:12-slim
          command: ["bash", "-c"]
          env:
            - name: FINISH_SLEEP
              value: "180"
          args:
            - |
              echo "=== Download Job Complete ==="
              echo "OSM summary:"
              du -sh /custom_files/* 2>/dev/null || true
              echo "Elevation summary:"
              du -sh /custom_files/elevation_data/* 2>/dev/null || true
              echo "GTFS summary:"
              du -sh /gtfs_feeds/* 2>/dev/null || true
              echo "Job finished successfully"
              sleep "$FINISH_SLEEP"
          volumeMounts:
            - name: data
              mountPath: /custom_files
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: valhalla-data
        - name: gtfs-feeds-data
          persistentVolumeClaim:
            claimName: gtfs-feeds-data
        - name: scripts
          configMap:
            name: valhalla-download-scripts
            defaultMode: 0555 # rx for all users

