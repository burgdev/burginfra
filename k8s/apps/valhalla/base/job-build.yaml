apiVersion: batch/v1
kind: Job
metadata:
  name: valhalla-build
  namespace: ${NAMESPACE}
spec:
  backoffLimit: 0 # Don't retry, keep failed pod for debugging
  ttlSecondsAfterFinished: 86400 # Keep for 24h for debugging
  template:
    metadata:
      labels:
        app: valhalla
        job: build
    spec:
      restartPolicy: Never # Don't restart, keep failed container for inspection
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      initContainers:
        # Check if we should build based on mode
        - name: check-build-mode
          image: debian:12-slim
          command: ["/bin/bash", "-c"]
          args:
            - |
              source /scripts/job-functions.sh
              if ! handle_build_mode; then
                echo "Skipping build based on mode"
                exit 0
              fi
              echo "Proceeding with build"
          env:
            - name: VALHALLA_INIT_JOB
              value: ${VALHALLA_INIT_JOB}
            - name: TARGET_DIR
              value: /custom_files
          volumeMounts:
            - name: data
              mountPath: /custom_files
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi

      containers:
        - name: build-tiles
          image: ghcr.io/valhalla/valhalla-scripted:latest
          imagePullPolicy: IfNotPresent
          env:
            # Tile building configuration
            - name: serve_tiles
              value: "false" # Don't start server, just build
            - name: force_rebuild
              value: "true" # Always rebuild when job runs
            - name: build_elevation
              value: "true" # Build elevation data
            - name: build_admins
              value: "true" # Build admin database
            - name: build_time_zones
              value: "true" # Build timezone database
            - name: build_transit
              value: "true" # Build transit routing
            - name: build_tar
              value: "true" # Create tarball for fast loading
            - name: server_threads
              value: "2" # Conservative for 16GB RAM cluster
            - name: use_tiles_ignore_pbf
              value: "false" # Build from PBF, don't skip
            - name: ERROR_SLEEP
              value: "180"
          volumeMounts:
            - name: data
              mountPath: /custom_files
            - name: gtfs-feeds-data
              mountPath: /gtfs_feeds
          resources:
            requests:
              cpu: ${VALHALLA_BUILD_CPU}
              memory: ${VALHALLA_BUILD_MEMORY}
            limits:
              memory: ${VALHALLA_BUILD_MEMORY}

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: valhalla-data
        - name: gtfs-feeds-data
          persistentVolumeClaim:
            claimName: gtfs-feeds-data
        - name: scripts
          configMap:
            name: valhalla-download-scripts
            defaultMode: 0555
