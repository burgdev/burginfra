apiVersion: batch/v1
kind: Job
metadata:
  name: valhalla-build
  namespace: ${NAMESPACE}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400 # Keep for 24h for debugging
  template:
    metadata:
      labels:
        app: valhalla
        job: build
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      containers:
        - name: build-tiles
          image: ghcr.io/valhalla/valhalla-scripted:latest
          imagePullPolicy: IfNotPresent
          env:
            # Tile building configuration
            - name: serve_tiles
              value: "false" # Don't start server, just build
            - name: force_rebuild
              value: "true" # Always rebuild when job runs
            - name: build_elevation
              value: "true" # Build elevation data
            - name: build_admins
              value: "true" # Build admin database
            - name: build_time_zones
              value: "true" # Build timezone database
            - name: build_transit
              value: "true" # Build transit routing
            - name: build_tar
              value: "true" # Create tarball for fast loading
            - name: server_threads
              value: "2" # Conservative for 16GB RAM cluster
            - name: use_tiles_ignore_pbf
              value: "false" # Build from PBF, don't skip
          volumeMounts:
            - name: data
              mountPath: /custom_files
          resources:
            requests:
              cpu: 2
              memory: 6Gi
            limits:
              memory: 8Gi # Half of cluster RAM, no CPU limit to avoid throttling

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: valhalla-data
