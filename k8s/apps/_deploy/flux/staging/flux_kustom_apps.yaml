# this is used by flux, do not include in any app kustomization.yaml file!
# TODO: add to k8s/flux/*/kustomization.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-sync-all-staging
  namespace: flux-system # do not change!
spec:
  interval: 5m
  path: "./k8s/apps/_deploy/staging"
  prune: false
  #dependsOn:
  #  - name: infra-csi-driver-rclone-system
  #  - name: infra-openebs-system
  #  - name: infra-openbao-configs
  sourceRef: # k8s/clusters/local/flux-system/gotk-sync.yaml
    kind: GitRepository
    name: burgdev-burginfra
  postBuild:
    substitute:
      NAMESPACE: "staging"
      ENVIRONMENT: "staging"
      ENV_SUBDOMAIN: "staging."
    substituteFrom:
      - kind: ConfigMap # takes configmap from namespace flux-system
        name: cluster-settings
