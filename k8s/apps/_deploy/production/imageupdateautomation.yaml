# ImageUpdateAutomation writes image updates back to Git
# Control with IMAGE_AUTOMATION_SUSPEND variable in cluster_settings.yaml
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageUpdateAutomation
metadata:
  name: flux-apps-auto-update
  namespace: flux-system
spec:
  interval: 1m
  suspend: ${IMAGE_AUTOMATION_SUSPEND:-true} # Suspended by default, enable per cluster
  sourceRef:
    kind: GitRepository
    name: burgdev-burginfra
  git:
    checkout:
      ref:
        branch: staging # Your current branch
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: |
        Fluxcd: {{ range $resource, $changes := .Changed.Objects }}{{ $resource.Name }} ({{ range $i, $change := $changes }}{{ if $i }}, {{ end }}{{ $change.OldValue }} -> {{ $change.NewValue }}{{ end }}){{ end }}

        Automation name: {{ .AutomationObject }}

        Files:
        {{ range $filename, $_ := .Changed.FileChanges -}}
        - {{ $filename }}
        {{ end -}}

        Objects:
        {{ range $resource, $changes := .Changed.Objects -}}
        - {{ $resource.Kind }} {{ $resource.Name }}
          Changes:
        {{- range $_, $change := $changes }}
            - {{ $change.OldValue }} -> {{ $change.NewValue }}
        {{ end -}}
        {{ end -}}
    push:
      branch: staging
  update:
    path: ./k8s/apps
    strategy: Setters
