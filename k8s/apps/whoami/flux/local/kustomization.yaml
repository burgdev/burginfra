# this is used by flux, do not inclue in any app kustomization.yaml file!
# it is referenced in k8s/flux/*/kustomization.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-whoami-local
  namespace: flux-system # do not change!
  
#dependsOn:
    #- name: base-configs  # optional, only if you have one

spec:
  interval: 5s
  path: "./k8s/apps/whoami/overlays/local"
  prune: true
  sourceRef: # k8s/clusters/local/flux-system/gotk-sync.yaml
    kind: GitRepository
    name: local-gitops
  postBuild:
    substitute:
      NAMESPACE: "whoami-local"
    substituteFrom:
      - kind: ConfigMap # takes configmap from namespace flux-system
        name: whoami-config-vars
        # optional: true
