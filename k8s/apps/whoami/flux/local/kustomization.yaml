# this is used by flux, do not inclue in any app kustomization.yaml file!
# it is referenced in k8s/flux/*/kustomization.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-whoami-local
  namespace: flux-system # do not change!
spec:
  interval: 5s
  path: "./k8s/apps/whoami/overlays/local"
  prune: true
  sourceRef: # k8s/clusters/local/flux-system/gotk-sync.yaml
    kind: GitRepository
    name: local-gitops
  postBuild:
    #substitute:
    #  DOMAIN: "whoami.burginfra"
    substituteFrom:
      - kind: ConfigMap
        name: whoami-config-vars
        namespace: whoami-local # make sure to have the same as in namespace.yaml and kustomization.yaml
        # optional: true
    #  - kind: Secret
    #    name: local-cluster-secret-vars
    #    optional: false
