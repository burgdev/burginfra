apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: ${CLUSTER}-podinfo-data # 'username' for kopia
spec:
  trigger:
    schedule: "0 */1 * * *" # every hour
  kopia:
    # Overwrite Retention Policy
    retain:
      hourly: 10
      daily: 1
      weekly: 1
      monthly: 1
      yearly: 1

