apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: podinfo-config1
  namespace: staging
spec:
  type: kv-v2
  mount: kv
  vaultAuthRef: staging # either default or staging
  destination:
    name: podinfo-config1 # the name of the K8s Secret
    create: true
    transformation:
      excludeRaw: true # exclue _raw field
  path: podinfo # OpenBao KV path

