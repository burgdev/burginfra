apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: podinfo
  annotations:
    cert-manager.io/cluster-issuer: ${CERT_ISSUER_PROD}
spec:
  rules:
    - host: podinfo.${ENV_SUBDOMAIN}${BURGINFRA_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: podinfo
                port:
                  number: 80
  tls:
    - secretName: podinfo-${ENVIRONMENT}-tls
      hosts:
        - podinfo.${ENV_SUBDOMAIN}${BURGINFRA_HOST}
