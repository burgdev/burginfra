apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-wodore-staging
  namespace: flux-system # do not change!
spec:
  interval: 3h0m
  retryInterval: 10s # Retry quickly when dependencies update or reconciliation fails
  path: "./k8s/apps/wodore/overlays/staging"
  prune: false
  dependsOn:
    - name: apps-sync-all-staging
  sourceRef: # k8s/clusters/local/flux-system/gotk-sync.yaml
    kind: GitRepository
    name: burgdev-burginfra
  postBuild:
    substitute:
      NAMESPACE: "staging"
      ENVIRONMENT: "staging"
      ENV_SUBDOMAIN: "staging."
      WD_BACKEND_TAG: "edge-alpine" # only used initially, after this backend/staging/imagepolicy.yaml
      # https://github.com/wodore/wodore-backend/pkgs/container/wodore-backend
      WD_FRONTEND_TAG: "edge-pwa" # https://github.com/wodore/wodore-frontend-quasar/pkgs/container/wodore-frontend-quasar
      IMAGOR_TAG: "1.6.7" # https://github.com/cshum/imagor/releases
      WD_AVAILABILITY_CRON: "30 5 */1 * *" # Every 6 hours at minute 0
    substituteFrom:
      - kind: ConfigMap # takes configmap from namespace flux-system
        name: cluster-settings
      - kind: Secret
        name: openbao-configs-heartbeats
        #- kind: Secret
        #  name: wodore-staging-config-secret
