apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-wodore-staging
  namespace: flux-system # do not change!
spec:
  interval: 3h0m
  retryInterval: 10s # fast retry on failures
  path: "./k8s/apps/wodore/overlays/staging"
  prune: false
  #dependsOn:
  #  - name: apps-sync-all-staging
  sourceRef: # k8s/clusters/local/flux-system/gotk-sync.yaml
    kind: GitRepository
    name: burgdev-burginfra
  postBuild:
    substitute:
      NAMESPACE: "staging"
      ENVIRONMENT: "staging"
      ENV_SUBDOMAIN: "stg."
      # auto updated by fluxcd
      # https://github.com/wodore/wodore-backend/pkgs/container/wodore-backend
      # yamllint disable rule:line-length
      WD_BACKEND_TAG: "20261006T0827-sha-c029fe8-alpine" # {"$imagepolicy": "flux-system:wd-backend-staging:tag"}
      # yamllint enable rule:line-length
      # https://github.com/wodore/wodore-frontend-quasar/pkgs/container/wodore-frontend-quasar
      # yamllint disable rule:line-length
      WD_FRONTEND_TAG: "20261006T1656-sha-8bba14d-pwa" # {"$imagepolicy": "flux-system:wd-frontend-staging:tag"}
      # yamllint enable rule:line-length
      WD_FRONTEND_APP_NAME: "Beta Wodore"
      IMAGOR_TAG: "1.9.6" # https://github.com/cshum/imagor/releases
      WD_AVAILABILITY_CRON: "30 5 */1 * *" # at 05:30 on every day
      # django-q2 task cluster (staging only for now; production stays at
      # the cluster-settings default of 0 until promoted)
      WD_QCLUSTER_REPLICAS: "1"
      # Async API runtime (backend #259 + #263): staging opts in via the
      # entrypoint patch (deployment-entrypoint.yaml); production keeps
      # the literal WSGI command until its image is bumped past #263.
      WODORE_ASGI_ENABLED: '"1"' # quotes survive flux substitution re-parse
      WODORE_POSTGRES_POOL: '"1"' # psycopg3 pool, required with ASGI
      WODORE_POSTGRES_POOL_SIZE: '"5"' # ~1-2 conns/worker; bounds DB budget
      # Pool checkout budget (backend #274): 10s < readiness deadline, so
      # an exhausted pool fails fast and loggable instead of hanging the
      # psycopg default 30s (2026-10-05 wedge: probe timeout + zombie checks)
      WODORE_POSTGRES_POOL_TIMEOUT: '"10"'
      # Staging: 2 fatter async workers (cluster default is 3); double
      # quotes force the string type through flux substitution re-parse
      WD_BACKEND_GUNICORN_WORKERS: '"2"'
      # (WODORE_GUNICORN_EXTRA_ARGS removed: gunicorn flags now ride in
      # GUNICORN_CMD_ARGS inside deployment-entrypoint.yaml; the old
      # --timeout 120 slow-request mitigation is obsolete under uvicorn
      # workers and --no-control-socket comes from entrypoint.sh)
    substituteFrom:
      - kind: ConfigMap # takes configmap from namespace flux-system
        name: cluster-settings
      - kind: Secret
        name: openbao-configs-heartbeats
        #- kind: Secret
        #  name: wodore-staging-config-secret
