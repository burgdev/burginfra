apiVersion: apps/v1
kind: Deployment
metadata:
  name: wd-imagor
spec:
  replicas: ${WODORE_REPLICAS}
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 60
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: wd-imagor
  template:
    metadata:
      labels:
        app: wd-imagor
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: "OnRootMismatch"
      containers:
        - name: wd-imagor
          image: shumc/imagor:${IMAGOR_TAG:-latest}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsUser: 1001
            runAsGroup: 1001
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: PORT
              value: "8000"
            - name: DEBUG
              value: "0"
            - name: IMAGOR_UNSAFE
              value: "0"
            - name: IMAGOR_SECRET
              valueFrom:
                secretKeyRef:
                  name: wd-imagor-config-secret
                  key: IMAGOR_SECRET
            - name: IMAGOR_AUTO_WEBP
              value: "1"
            - name: IMAGOR_AUTO_ACIF
              value: "1"
            - name: IMAGOR_SIGNER_TYPE
              value: "sha256"
            - name: FILE_LOADER_BASE_DIR
              value: "/mnt/data/source"
            - name: FILE_STORAGE_BASE_DIR
              value: "/mnt/data/storage"
            - name: FILE_RESULT_STORAGE_BASE_DIR
              value: "/mnt/data/result"
            - name: FILE_STORAGE_MKDIR_PERMISSION
              value: "0755"
            - name: FILE_STORAGE_WRITE_PERMISSION
              value: "0666"
            - name: FILE_RESULT_STORAGE_MKDIR_PERMISSION
              value: "0755"
            - name: FILE_RESULT_STORAGE_WRITE_PERMISSION
              value: "0666"
            - name: IMAGOR_RESULT_STORAGE_PATH_STYLE
              value: "size"
            - name: HTTP_LOADER_FORWARD_HEADERS
              value: "User-Agent,Accept"
            # VIPS Memory Management
            - name: VIPS_CONCURRENCY
              value: "2"
            - name: VIPS_MAX_CACHE_MEM
              value: "0"
            - name: VIPS_MAX_CACHE_FILES
              value: "0"
            - name: VIPS_MAX_CACHE_SIZE
              value: "0"
            # VIPS Image Limits (prevent DoS)
            - name: VIPS_MAX_WIDTH
              value: "8000"
            - name: VIPS_MAX_HEIGHT
              value: "8000"
            - name: VIPS_MAX_ANIMATION_FRAMES
              value: "1"
            # VIPS Performance & Quality
            - name: VIPS_STRIP_METADATA
              value: "1"
            # VIPS In-memory decoded pixel cache
            - name: VIPS_CACHE_SIZE
              value: "104857600"
            - name: VIPS_CACHE_MAX_WIDTH
              value: "2400"
            - name: VIPS_CACHE_MAX_HEIGHT
              value: "2000"
            - name: VIPS_CACHE_TTL
              value: "24h"
            # Timeout Settings (prevent OOM)
            - name: IMAGOR_PROCESS_TIMEOUT
              value: "30s"
            - name: IMAGOR_LOAD_TIMEOUT
              value: "10s"
            - name: IMAGOR_REQUEST_TIMEOUT
              value: "35s"
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    # Clean up potentially corrupted files from crash/OOM
                    # Both downloaded sources and processed results
                    find /mnt/data/storage -type f -mmin -10 -delete || true
                    find /mnt/data/result -type f -mmin -10 -delete || true
          volumeMounts:
            - name: backend-media
              mountPath: /mnt/data/source/wd
              readOnly: true
            - name: imagor-storage
              mountPath: /mnt/data/storage
            - name: imagor-result
              mountPath: /mnt/data/result
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 15
          resources:
            limits:
              memory: 2Gi
            requests:
              memory: 512Mi
              cpu: 500m
      volumes:
        # Shared PVC with backend - defined in backend/base/pvcs.yaml
        - name: backend-media
          persistentVolumeClaim:
            claimName: wd-backend-media-v1
        - name: imagor-storage
          persistentVolumeClaim:
            claimName: wd-imagor-storage-v1
        - name: imagor-result
          persistentVolumeClaim:
            claimName: wd-imagor-result-v1
