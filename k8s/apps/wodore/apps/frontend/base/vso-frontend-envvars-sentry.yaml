# Map the per-app Sentry DSN from OpenBao (SENTRY_DSN_FRONTEND at
# kv/apps/wodore/<env>) to the runtime env name the frontend image
# substitutes into the built assets: the entrypoint (replace_vars)
# only handles WODORE_* keys listed in the image's /dot_env_defaults
# (see frontend services/sentry.ts; empty string = Sentry off).
- op: add
  path: /spec/destination/transformation/templates/WODORE_SENTRY_DSN
  value:
    text: "{{ .Secrets.SENTRY_DSN_FRONTEND }}"
# Include BUNNY_* keys from OpenBao alongside WODORE_* (the base VSO's
# includes filter only matches WODORE_.*; BUNNY_API_KEY and
# BUNNY_FRONTEND_ZONE_ID are at kv/apps/wodore/<env> and feed the
# preStop shell-tag purge hook on the frontend deployment).
- op: replace
  path: /spec/destination/transformation/includes
  value:
    - "WODORE_.*"
    - "BUNNY_.*"
