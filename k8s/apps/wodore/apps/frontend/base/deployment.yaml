apiVersion: apps/v1
kind: Deployment
metadata:
  name: wd-frontend
spec:
  replicas: ${WODORE_REPLICAS}
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: wd-frontend
  template:
    metadata:
      labels:
        app: wd-frontend
    spec:
      securityContext:
        fsGroup: 101
      terminationGracePeriodSeconds: 180
      containers:
        - name: frontend
          image: ghcr.io/wodore/wodore-frontend-quasar:${WD_FRONTEND_TAG:-edge-pwa}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          lifecycle:
            preStop:
              exec:
                # CDN shell purge on pod termination (i.e. on rolling deploys:
                # the replacement pod is Ready BEFORE this one stops, so the
                # purge refetches fresh content - a postStart purge on the new
                # pod would re-cache the OLD shell from the still-serving old
                # pod for another s-maxage window). Crash restarts do not fire
                # preStop and never need a purge (same image).
                #
                # EXACT-URL purges only: with Perma-Cache enabled on the pull
                # zone, Bunny's tag- and wildcard purges clear just the edge
                # RAM cache - Perma-Cache entries survive and get re-served
                # (https://docs.bunny.net/docs/cdn-purge/). The
                # POST /purge?url=<exact> form removes the URL from both the
                # edge cache AND Perma-Cache. Purged set = "/" plus EVERY
                # root-level file in the retiring pod's webroot (the favicon/
                # PWA-icon family, robots.txt, the shell, env.js, sw.js,
                # manifest.json). Enumerating the RETIRING pod is provably
                # sufficient: a stale cache entry can only exist for a URL
                # this image knew - files added by the new image have no
                # cache history. Precompressed .br/.gz siblings are skipped:
                # nginx serves them via transparent encoding negotiation on
                # the SAME url, so the base-URL purge covers them. Subdirs
                # (assets/ is hashed-immutable; icons/ images/ logos/ ... are
                # design-static) keep their TTLs and are not purged. This is
                # what lets the nginx favicon block ship s-maxage=30d
                # (wodore-frontend-quasar nginx-default.conf): deploys
                # invalidate by exact URL, browsers revalidate on revisit.
                # No-ops unless BUNNY_API_KEY (OpenBao:
                # wd-frontend-envvars) and BUNNY_FRONTEND_ZONE_ID (flux
                # substitute, per env - bunny-enabled gate; the /purge endpoint
                # itself resolves the zone by hostname) are set. The zone
                # hostname is composed from the ENV_SUBDOMAIN + WODORE_HOST
                # flux substitutes (same pattern as every URL in this file).
                # ENVSUBST RULE: braced ${VARS} in this template are FLUX
                # substitutes (strict mode fails on unknown ones); shell
                # variables must stay BARE ($f, $BUNNY_API_KEY...) so
                # envsubst passes them through to the container shell.
                # Best-effort: never blocks termination (wget -T 5, || true);
                # terminationGracePeriodSeconds is raised (180 s) so ~100+
                # sequential purge calls finish inside the grace window.
                # yamllint disable rule:line-length
                command:
                  - /bin/sh
                  - -c
                  - |
                    sleep 5
                    if [ -n "$BUNNY_API_KEY" ] && [ -n "$BUNNY_FRONTEND_ZONE_ID" ]; then
                      wget -q -T 5 -O /dev/null \
                        --header="AccessKey: $BUNNY_API_KEY" \
                        --post-data="" \
                        "https://api.bunny.net/purge?url=https://${ENV_SUBDOMAIN}${WODORE_HOST}/&async=false" || true
                      cd /usr/share/nginx/html || true
                      find * -type f | while read -r f; do
                        case "$f" in
                          *.br|*.gz|*.map|robots-origin.txt) continue ;;
                        esac
                        # Skip content-hashed builds: NAME-<8 chars>.EXT
                        # (Vite chunk/workbox hashes are always 8; the
                        # dash-numbers false friends - favicon-16x16,
                        # mstile-150x150 - are 5/7 chars). Immutable, never
                        # purged. Everything else changes with deploys.
                        case "$f" in
                          *-????????.*) continue ;;
                        esac
                        wget -q -T 5 -O /dev/null \
                          --header="AccessKey: $BUNNY_API_KEY" \
                          --post-data="" \
                          "https://api.bunny.net/purge?url=https://${ENV_SUBDOMAIN}${WODORE_HOST}/$f&async=false" || true
                      done
                    fi
                # yamllint enable rule:line-length
          env:
            ## - name: NGINX_CONFIG # not needed in kubernetes
            ##   value: "proxy"
            - name: TMPDIR
              value: "/var/tmp"
            - name: WODORE_TILE_SERVER_URL
              # CDN_SUBDOMAIN inserts the CDN label between service and env
              # subdomain: tiles.cdn.stg.wodore.com (staging, through Bunny) /
              # tiles.wodore.com (prod, direct until CDN_SUBDOMAIN flips there)
              # yamllint disable rule:line-length
              value: https://tiles.${CDN_SUBDOMAIN}${ENV_SUBDOMAIN}${WODORE_HOST}
              # yamllint enable rule:line-length
            # In-cluster API upstream for the frontend nginx proxy (see
            # wodore-frontend-quasar docker/nginx-default.conf): avoids
            # resolving the public hub hostname at nginx config load, which
            # crash-looped staging during the 2026-10-25 DNS records outage.
            # Ignored by images that do not support the variable yet; the
            # proxy must keep Host <public hub host> for Django ALLOWED_HOSTS.
            - name: WODORE_API_UPSTREAM
              value: wd-backend-api.${NAMESPACE}.svc.cluster.local:8008
            # Public/unauthenticated API GETs (frontend #339): Bearer-less
            # GETs use this base; auth'd calls keep WODORE_API_HOST. Composed
            # with CDN_SUBDOMAIN: hub.cdn.stg.wodore.com (staging, Bunny) /
            # hub.wodore.com (prod = same host, no-op until CDN flips there).
            - name: WODORE_PUBLIC_API_URL
              # yamllint disable rule:line-length
              value: https://hub.${CDN_SUBDOMAIN}${ENV_SUBDOMAIN}${WODORE_HOST}
              # yamllint enable rule:line-length
          envFrom:
            - secretRef:
                name: "wd-frontend-envvars"
                optional: false
          livenessProbe:
            httpGet:
              path: /robots.txt
              port: http
              httpHeaders:
                - name: Host
                  value: ${ENV_SUBDOMAIN}${WODORE_HOST}
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /robots.txt
              port: http
              httpHeaders:
                - name: Host
                  value: ${ENV_SUBDOMAIN}${WODORE_HOST}
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
