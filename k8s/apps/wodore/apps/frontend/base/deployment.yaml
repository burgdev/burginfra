apiVersion: apps/v1
kind: Deployment
metadata:
  name: wd-frontend
spec:
  replicas: ${WODORE_REPLICAS}
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: wd-frontend
  template:
    metadata:
      labels:
        app: wd-frontend
    spec:
      securityContext:
        fsGroup: 101
      terminationGracePeriodSeconds: 180
      containers:
        - name: frontend
          image: ghcr.io/wodore/wodore-frontend-quasar:${WD_FRONTEND_TAG:-edge-pwa}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          lifecycle:
            postStart:
              exec:
                # Post-rollout CDN purge + warmup, delayed past the retiring
                # pod's termination window (grace 180 s + margin): by then the
                # new pod is provably the ONLY origin, so the purge cannot
                # re-poison the edge with the old build's bytes (measured
                # 2026-10-26/27: purges fired while the draining pod still
                # answered origin pulls re-cached stale content). A stale
                # window of a few seconds to ~3 minutes after a deploy is
                # accepted by design - the shell itself is private/uncached
                # and self-corrects the moment the old pod is gone; this
                # covers the edge-cached files (env.js, sw.js, manifest,
                # favicons, unhashed statics).
                # Backgrounded so postStart returns immediately; idempotent
                # (pod restarts just re-run it).
                # ENVSUBST RULE: braced ${VARS} are FLUX substitutes; shell
                # variables stay BARE so envsubst passes them through.
                # yamllint disable rule:line-length
                command:
                  - /bin/sh
                  - -c
                  - |
                    (sleep 200
                    if [ -n "$BUNNY_API_KEY" ] && [ -n "$BUNNY_FRONTEND_ZONE_ID" ]; then
                      cd /usr/share/nginx/html || exit 0
                      for p in "https://${ENV_SUBDOMAIN}${WODORE_HOST}" "https://${WODORE_HOST}/index.html"; do
                        wget -q -T 5 -O /dev/null \
                          --header="AccessKey: $BUNNY_API_KEY" \
                          --post-data="" \
                          "https://api.bunny.net/purge?url=$p&async=false" || true
                      done
                      find * -type f | while read -r f; do
                        case "$f" in
                          *.br|*.gz|*.map|robots-origin.txt) continue ;;
                          *-????????.*) continue ;;
                        esac
                        wget -q -T 5 -O /dev/null \
                          --header="AccessKey: $BUNNY_API_KEY" \
                          --post-data="" \
                          "https://api.bunny.net/purge?url=https://${ENV_SUBDOMAIN}${WODORE_HOST}/$f&async=false" || true
                      done
                      # Warm the edge from the now-sole current pod.
                      for p in / /index.html /env.js /sw.js /manifest.json /favicon.ico /icons.svg; do
                        wget -q -T 5 -O /dev/null "https://${ENV_SUBDOMAIN}${WODORE_HOST}$p" || true
                      done
                    fi) &
            preStop:
              exec:
                # Plain connection drain: the CDN purge moved to the NEW
                # pod's postStart (see above). Keep a short sleep so
                # in-flight requests finish before SIGTERM.
                command: ["/bin/sh", "-c", "sleep 10"]
          env:
            ## - name: NGINX_CONFIG # not needed in kubernetes
            ##   value: "proxy"
            - name: TMPDIR
              value: "/var/tmp"
            - name: WODORE_TILE_SERVER_URL
              # CDN_SUBDOMAIN inserts the CDN label between service and env
              # subdomain: tiles.cdn.stg.wodore.com (staging, through Bunny) /
              # tiles.wodore.com (prod, direct until CDN_SUBDOMAIN flips there)
              # yamllint disable rule:line-length
              value: https://tiles.${CDN_SUBDOMAIN}${ENV_SUBDOMAIN}${WODORE_HOST}
              # yamllint enable rule:line-length
            # In-cluster API upstream for the frontend nginx proxy (see
            # wodore-frontend-quasar docker/nginx-default.conf): avoids
            # resolving the public hub hostname at nginx config load, which
            # crash-looped staging during the 2026-10-25 DNS records outage.
            # Ignored by images that do not support the variable yet; the
            # proxy must keep Host <public hub host> for Django ALLOWED_HOSTS.
            - name: WODORE_API_UPSTREAM
              value: wd-backend-api.${NAMESPACE}.svc.cluster.local:8008
            # Public/unauthenticated API GETs (frontend #339): Bearer-less
            # GETs use this base; auth'd calls keep WODORE_API_HOST. Composed
            # with CDN_SUBDOMAIN: hub.cdn.stg.wodore.com (staging, Bunny) /
            # hub.wodore.com (prod = same host, no-op until CDN flips there).
            - name: WODORE_PUBLIC_API_URL
              # yamllint disable rule:line-length
              value: https://hub.${CDN_SUBDOMAIN}${ENV_SUBDOMAIN}${WODORE_HOST}
              # yamllint enable rule:line-length
          envFrom:
            - secretRef:
                name: "wd-frontend-envvars"
                optional: false
          livenessProbe:
            httpGet:
              path: /robots.txt
              port: http
              httpHeaders:
                - name: Host
                  value: ${ENV_SUBDOMAIN}${WODORE_HOST}
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /robots.txt
              port: http
              httpHeaders:
                - name: Host
                  value: ${ENV_SUBDOMAIN}${WODORE_HOST}
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
