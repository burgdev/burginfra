apiVersion: apps/v1
kind: Deployment
metadata:
  name: wd-frontend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: wd-frontend
  template:
    metadata:
      labels:
        app: wd-frontend
    spec:
      securityContext:
        fsGroup: 101
      containers:
        - name: frontend
          image: ghcr.io/wodore/wodore-frontend-quasar:${WD_FRONTEND_TAG:-edge-pwa}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: NGINX_CONFIG
              value: "nginx-proxy.conf"
            - name: TMPDIR
              value: "/var/tmp"
          envFrom:
            - secretRef:
                name: "wd-frontend-envvars"
                optional: false
          livenessProbe:
            httpGet:
              path: /robots.txt
              port: http
              httpHeaders:
                - name: Host
                  value: ${ENV_SUBDOMAIN}${WODORE_HOST}
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /robots.txt
              port: http
              httpHeaders:
                - name: Host
                  value: ${ENV_SUBDOMAIN}${WODORE_HOST}
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
