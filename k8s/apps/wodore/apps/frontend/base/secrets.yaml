apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: wd-frontend-envvars
spec:
  type: kv-v2
  mount: kv
  vaultAuthRef: apps-kv-${NAMESPACE}
  destination:
    name: wd-frontend-envvars
    create: true
    transformation:
      excludeRaw: true
      includes: ["WODORE_.*"]
      templates:
        WODORE_API_HOST:
          text: "https://api.${ENV_SUBDOMAIN}${WODORE_HOST}"
        WODORE_URL:
          text: "${ENV_SUBDOMAIN}${WODORE_HOST}"
        WODORE_DOMAIN:
          text: "${ENV_SUBDOMAIN}${WODORE_HOST}"
  path: apps/wodore/${NAMESPACE}
