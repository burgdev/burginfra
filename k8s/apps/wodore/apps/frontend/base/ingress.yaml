apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wd-frontend
  annotations:
    cert-manager.io/cluster-issuer: ${CERT_MANAGER_CLUSTER_ISSUER}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ${ENV_SUBDOMAIN}${WODORE_HOST}
      secretName: wd-frontend-tls
  rules:
    - host: ${ENV_SUBDOMAIN}${WODORE_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wd-frontend
                port:
                  number: 80
