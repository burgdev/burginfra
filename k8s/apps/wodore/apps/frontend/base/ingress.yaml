apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wd-frontend
  annotations:
    cert-manager.io/cluster-issuer: ${CERT_ISSUER_PROD}
spec:
  rules:
    - host: ${ENV_SUBDOMAIN}${WODORE_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wd-frontend
                port:
                  number: 80
    - host: ${ENV_SUBDOMAIN}${WODO_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wd-frontend
                port:
                  number: 80
  tls:
    - hosts:
        - ${ENV_SUBDOMAIN}${WODORE_HOST}
        - ${ENV_SUBDOMAIN}${WODO_HOST}
      secretName: wd-frontend-tls
---
# Hidden origin hostnames for the CDN (Bunny): when the public frontend
# host is CNAME'd to the CDN, Bunny connects here with SNI orig.* but
# sends Host <public host> (Origin Host Header override) - the public rules
# above keep doing the routing. Locked to Bunny edge IPs via the
# wd-bunny-allowlist middleware so these duplicate-content hosts are
# unreachable for everyone else. cert-manager http01 renewals still work:
# the ACME solver creates its own ingress without the middleware.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wd-frontend-orig
  annotations:
    cert-manager.io/cluster-issuer: ${CERT_ISSUER_PROD}
    # yamllint disable rule:line-length
    traefik.ingress.kubernetes.io/router.middlewares: ${NAMESPACE}-wd-bunny-allowlist@kubernetescrd
    # yamllint enable rule:line-length
spec:
  rules:
    - host: orig.${ENV_SUBDOMAIN}${WODORE_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wd-frontend
                port:
                  number: 80
    - host: orig.${ENV_SUBDOMAIN}${WODO_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wd-frontend
                port:
                  number: 80
  tls:
    - hosts:
        - orig.${ENV_SUBDOMAIN}${WODORE_HOST}
        - orig.${ENV_SUBDOMAIN}${WODO_HOST}
      secretName: wd-frontend-orig-tls
