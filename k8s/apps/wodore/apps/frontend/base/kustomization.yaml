apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ${NAMESPACE}
resources:
  - secrets.yaml
  - service.yaml
  - ingress.yaml
  - middleware-bunny-allowlist.yaml
  - deployment.yaml
patches:
  - path: vso-frontend-envvars-sentry.yaml
    target:
      group: secrets.hashicorp.com
      version: v1beta1
      kind: VaultStaticSecret
      name: wd-frontend-envvars
