apiVersion: batch/v1
kind: Job
metadata:
  name: wd-backend-migrate
  annotations:
    # This annotation tells Flux to recreate the job on each reconciliation
    kustomize.toolkit.fluxcd.io/force: "enabled"
spec:
  # Auto-cleanup completed jobs after 5 minutes
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: wd-backend-migrate
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: "OnRootMismatch"
      containers:
        - name: migrate
          image: ghcr.io/wodore/wodore-backend:edge-alpine
          imagePullPolicy: Always
          command:
            - python
            - manage.py
            - migrate
            - --noinput
          env:
            #- name: DJANGO_ENV
            #  value: "production"
            #- name: DJANGO_ADMIN_URL
            #  value: "https://api.${ENV_SUBDOMAIN}.${WODORE_HOST}/admin"
            #- name: DJANGO_TRUSTED_DOMAINS
            #  value: "api.${ENV_SUBDOMAIN}.${WODORE_HOST},${ENV_SUBDOMAIN}.${WODORE_HOST},api.${ENV_SUBDOMAIN}.${WODO_HOST},${ENV_SUBDOMAIN}.${WODO_HOST}"
            #- name: FRONTEND_DOMAIN
            #  value: "https://${ENV_SUBDOMAIN}.${WODORE_HOST}"
            # Database connection (CNPG service)
            - name: DJANGO_DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: wd-backend-postgres-app
                  key: host
            - name: DJANGO_DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: wd-backend-postgres-app
                  key: port
            - name: DJANGO_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: wd-backend-postgres-app
                  key: dbname
            - name: DJANGO_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: wd-backend-postgres-app
                  key: username
            - name: DJANGO_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wd-backend-postgres-app
                  key: password
          envFrom:
            - secretRef:
                name: "wd-backend-envvars"
            - secretRef:
                name: "wd-backend-smtp-envvars"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
