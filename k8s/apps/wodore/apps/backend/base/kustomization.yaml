apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ${NAMESPACE}
commonLabels:
  app.kubernetes.io/name: wd-backend
  app.kubernetes.io/component: api
  app.kubernetes.io/environment: ${ENVIRONMENT}
  app.kubernetes.io/part-of: apps
  app.kubernetes.io/managed-by: flux
resources:
  - secrets.yaml
  - pvcs.yaml
  - postgres.yaml
  - job-migrate.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - cronjob-availability.yaml
  - imagerepository-flux-system.yaml
