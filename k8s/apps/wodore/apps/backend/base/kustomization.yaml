apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ${NAMESPACE}
commonLabels:
  app.kubernetes.io/name: wd-backend
  app.kubernetes.io/component: api
  app.kubernetes.io/environment: ${ENVIRONMENT}
  app.kubernetes.io/part-of: apps
  app.kubernetes.io/managed-by: flux
resources:
  - secrets.yaml
  - pvcs.yaml
  - postgres.yaml
  - job-migrate.yaml
  - nginx-media.yaml
  - deployment.yaml
  - deployment-qcluster.yaml
  - service.yaml
  - ingress.yaml
  - cronjob-availability.yaml
patches:
  - path: vso-backend-envvars-sentry.yaml
    target:
      group: secrets.hashicorp.com
      version: v1beta1
      kind: VaultStaticSecret
      name: wd-backend-envvars
