apiVersion: batch/v1
kind: CronJob
metadata:
  name: wd-backend-availability
  annotations:
    reloader.stakater.com/match: "false"
spec:
  suspend: ${WD_CRON_AVAILABILITY_SUSPEND:-false}
  schedule: "${WD_AVAILABILITY_CRON:-0 * * * *}" # Default: every hour at minute 0
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid # Prevent overlapping jobs
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600 # 1 hour timeout
      template:
        metadata:
          labels:
            app: wd-backend-cronjob
            cronjob: availability
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            fsGroupChangePolicy: "OnRootMismatch"
          containers:
            - name: update-availability
              image: ghcr.io/wodore/wodore-backend:${WD_BACKEND_TAG:-latest-alpine}
              imagePullPolicy: Always
              command:
                - /bin/sh
                - -c
                - |
                  echo "Starting availability update at $(date)"

                  # Run the update command and capture exit status
                  if ./manage.py update_availability --no-progress --request-interval 4; then
                    STATUS=0
                    echo "Availability update completed successfully at $(date)"
                  else
                    STATUS=$?
                    echo "Availability update failed with exit code ${STATUS} at $(date)"
                  fi

                  # Send heartbeat with status if URL is configured
                  if [ -n "${BEAT_WODORE_AVAILABILITY:-}" ]; then
                    echo "Sending heartbeat to ${BEAT_WODORE_AVAILABILITY}/$STATUS"
                    wget -q -O- "${BEAT_WODORE_AVAILABILITY}/${STATUS}" || echo "Heartbeat failed (non-critical)"
                  else
                    echo "No heartbeat URL configured, skipping"
                  fi

                  echo "Job completed at $(date)"
                  exit $STATUS
              env:
                # Database connection (CNPG service)
                - name: DJANGO_DATABASE_HOST
                  valueFrom:
                    secretKeyRef:
                      name: wd-backend-postgres-app
                      key: host
                - name: DJANGO_DATABASE_PORT
                  valueFrom:
                    secretKeyRef:
                      name: wd-backend-postgres-app
                      key: port
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: wd-backend-postgres-app
                      key: dbname
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: wd-backend-postgres-app
                      key: username
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: wd-backend-postgres-app
                      key: password
              envFrom:
                - secretRef:
                    name: "wd-backend-envvars"
              resources:
                limits:
                  memory: 512Mi
                requests:
                  memory: 512Mi
