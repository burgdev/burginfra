apiVersion: v1
kind: Service
metadata:
  name: wd-backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8008
      targetPort: http
      protocol: TCP
  selector:
    app: wd-backend
---
apiVersion: v1
kind: Service
metadata:
  name: wd-backend-media-v0
spec:
  type: ClusterIP
  ports:
    - name: media
      port: 80
      targetPort: media
      protocol: TCP
  selector:
    app: wd-backend
