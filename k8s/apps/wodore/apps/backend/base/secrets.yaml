apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: wd-backend-envvars
spec:
  type: kv-v2
  mount: kv
  vaultAuthRef: apps-kv-${NAMESPACE}
  destination:
    name: wd-backend-envvars
    create: true
    transformation:
      excludeRaw: true
      #excludes: ["^_.*"]
      includes:
        ["DJANGO_.*", "ZITADEL_.*", "OIDC_.*", "HRS_AUTHORIZATION_KEY.*"]
      templates:
        DJANGO_ENV:
          text: "production"
        DJANGO_ADMIN_URL:
          text: "https://api.${ENV_SUBDOMAIN}.${WODORE_HOST}/admin"
        DJANGO_TRUSTED_DOMAINS:
          text: "api.${ENV_SUBDOMAIN}.${WODORE_HOST},${ENV_SUBDOMAIN}.${WODORE_HOST},api.${ENV_SUBDOMAIN}.${WODO_HOST},${ENV_SUBDOMAIN}.${WODO_HOST}"
        FRONTEND_DOMAIN:
          text: "https://${ENV_SUBDOMAIN}.${WODORE_HOST}"
  path: apps/wodore/${NAMESPACE}
---
# DJANO SMTP VARIABLES
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: wd-backend-smtp-envvars
spec:
  type: kv-v2
  mount: kv
  vaultAuthRef: configs-kv-all
  destination:
    name: wd-backend-smtp-envvars
    create: true
    transformation:
      excludeRaw: true
      excludes: [".*"]
      #includes: ["SMTP_.*"]
      templates:
        EMAIL_HOST:
          text: "{{ .Secrets.SMTP_HOST }}"
        EMAIL_HOST_PASSWORD:
          text: "{{ .Secrets.SMTP_PASSWORD }}"
        EMAIL_HOST_USER:
          text: "{{ .Secrets.SMTP_USERNAME }}"
        EMAIL_PORT:
          text: "{{ .Secrets.SMTP_PORT }}"
        EMAIL_USE_SSL:
          text: "{{ .Secrets.SMTP_SSL }}"
        EMAIL_USE_TLS:
          text: "{{ .Secrets.SMTP_TLS }}"
  path: configs/smtp
