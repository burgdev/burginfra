apiVersion: apps/v1
kind: Deployment
metadata:
  name: wd-backend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: wd-backend
  template:
    metadata:
      labels:
        app: wd-backend
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: "OnRootMismatch"
      initContainers:
        # Check migrations are applied
        - name: check-migrations
          image: ghcr.io/wodore/wodore-backend:edge-alpine
          imagePullPolicy: Always
          command:
            - python
            - manage.py
            - migrate
            - --check
            - --noinput
          env:
            - name: DJANGO_ENV
              value: "production"
            # Database connection (CNPG service)
            - name: DJANGO_DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: wd-backend-postgres-app
                  key: host
            - name: DJANGO_DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: wd-backend-postgres-app
                  key: port
            - name: DJANGO_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: wd-backend-postgres-app
                  key: dbname
            - name: DJANGO_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: wd-backend-postgres-app
                  key: username
            - name: DJANGO_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wd-backend-postgres-app
                  key: password
          envFrom:
            - secretRef:
                name: "wd-backend-envvars"
            - secretRef:
                name: "wd-backend-smtp-envvars"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 512Mi
      containers:
        # Django backend container
        - name: backend
          image: ghcr.io/wodore/wodore-backend:edge-alpine
          imagePullPolicy: Always
          command:
            - gunicorn
            - -b
            - 0.0.0.0:8008
            - -w
            - "3"
            - --preload
            - server.wsgi:application
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          ports:
            - name: http
              containerPort: 8008
              protocol: TCP
          env:
            - name: DJANGO_ENV
              value: "production"
            - name: DJANGO_ADMIN_URL
              value: "https://api.${ENV_SUBDOMAIN}.${WODORE_HOST}/admin"
            - name: DJANGO_TRUSTED_DOMAINS
              value: "api.${ENV_SUBDOMAIN}.${WODORE_HOST},${ENV_SUBDOMAIN}.${WODORE_HOST},api.${ENV_SUBDOMAIN}.${WODO_HOST},${ENV_SUBDOMAIN}.${WODO_HOST}"
            - name: FRONTEND_DOMAIN
              value: "https://${ENV_SUBDOMAIN}.${WODORE_HOST}"
            # Imagor settings
            - name: IMAGOR_URL
              value: "https://img.${ENV_SUBDOMAIN}.${WODORE_HOST}"
            - name: IMAGOR_KEY
              valueFrom:
                secretKeyRef:
                  name: wd-imagor-config-secret
                  key: IMAGOR_SECRET
            # E-Mail (smtp settings in secrets.yaml)
            - name: DEFAULT_FROM_EMAIL
              value: "${WODORE_HOST} <no-reply@${WODORE_HOST}>"
            - name: DJANGO_ADMIN_EMAILS
              value: "${WODORE_EMAIL}>"
            - name: EMAIL_ADMIN_FROM_EMAIL
              value: "${WODORE_HOST} internal <no-reply@${WODORE_HOST}>"
            - name: EMAIL_DEFAULT_FROM_EMAIL
              value: "${WODORE_HOST} <no-reply@${WODORE_HOST}>"
            # Database connection (CNPG service)
            - name: DJANGO_DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: wd-backend-postgres-app
                  key: host
            - name: DJANGO_DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: wd-backend-postgres-app
                  key: port
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: wd-backend-postgres-app
                  key: dbname
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: wd-backend-postgres-app
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wd-backend-postgres-app
                  key: password
          envFrom:
            - secretRef:
                name: "wd-backend-envvars"
            - secretRef:
                name: "wd-backend-smtp-envvars"
          volumeMounts:
            - name: media
              mountPath: /code/media
            - name: py-cache
              mountPath: /tmp/py_file_cache/joblib
          livenessProbe:
            httpGet:
              path: /health/
              port: http
            initialDelaySeconds: 60
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            limits:
              cpu: 2000m
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
        # Nginx static media server container
        - name: media
          image: flashspys/nginx-static:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 0
            runAsGroup: 0
          ports:
            - name: media
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: media
              mountPath: /static
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: media
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: media
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: wd-backend-media-v0
        - name: py-cache
          persistentVolumeClaim:
            claimName: wd-backend-py-cache-v0
