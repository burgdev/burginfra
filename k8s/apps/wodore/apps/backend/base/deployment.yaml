apiVersion: apps/v1
kind: Deployment
metadata:
  name: wd-backend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: wd-backend
  template:
    metadata:
      labels:
        app: wd-backend
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      initContainers:
        # Wait for database to be ready
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z wd-postgres-rw 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
      containers:
        # Django backend container
        - name: backend
          image: ghcr.io/wodore/wodore-backend:edge-alpine
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - name: http
              containerPort: 8008
              protocol: TCP
          env:
            - name: DJANGO_ENV
              value: "production"
            - name: DJANGO_ADMIN_URLS
              value: "https://api.${ENV_SUBDOMAIN}.${WODORE_HOST}"
            # Database connection (CNPG service)
            - name: DJANGO_DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: wd-backend-postgres-app
                  key: host
            - name: DJANGO_DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: wd-backend-postgres-app
                  key: port
            - name: DJANGO_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: wd-backend-postgres-app
                  key: dbname
            - name: DJANGO_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: wd-backend-postgres-app
                  key: username
            - name: DJANGO_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wd-backend-postgres-app
                  key: password
          envFrom:
            - secretRef:
                name: "wd-backend-envvars"
            - secretRef:
                name: "wd-backend-smtp-envvars"
          volumeMounts:
            - name: media
              mountPath: /code/media
            - name: py-cache
              mountPath: /tmp/py_file_cache/joblib
          livenessProbe:
            httpGet:
              path: /health/
              port: http
            initialDelaySeconds: 60
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            limits:
              cpu: 2000m
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
        # Nginx static media server container
        - name: media
          image: flashspys/nginx-static:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - name: media
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: media
              mountPath: /static
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: media
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: media
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: wd-backend-media-v0
        - name: py-cache
          persistentVolumeClaim:
            claimName: wd-backend-py-cache-v0
