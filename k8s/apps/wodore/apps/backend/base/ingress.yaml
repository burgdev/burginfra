apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: media-cors
spec:
  headers:
    accessControlAllowMethods:
      - GET
      - OPTIONS
    accessControlAllowOriginList:
      - "https://hub.${ENV_SUBDOMAIN}${WODORE_HOST}"
      - "https://${ENV_SUBDOMAIN}${WODORE_HOST}"
      - "https://hub.${ENV_SUBDOMAIN}${WODO_HOST}"
      - "https://${ENV_SUBDOMAIN}${WODO_HOST}"
    accessControlMaxAge: 86400
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wd-backend
  annotations:
    cert-manager.io/cluster-issuer: ${CERT_ISSUER_PROD}
    traefik.ingress.kubernetes.io/router.middlewares: ${NAMESPACE}-media-cors@kubernetescrd
spec:
  rules:
    - host: hub.${ENV_SUBDOMAIN}${WODORE_HOST}
      http:
        paths:
          # Media files served by nginx (higher priority)
          - path: /media
            pathType: Prefix
            backend:
              service:
                name: wd-backend-media
                port:
                  number: 80
          # Django backend (catch-all)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wd-backend-api
                port:
                  number: 8008
  tls:
    - secretName: wd-backend-${ENVIRONMENT}-tls
      hosts:
        - hub.${ENV_SUBDOMAIN}${WODORE_HOST}
