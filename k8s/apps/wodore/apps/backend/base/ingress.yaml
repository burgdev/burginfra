apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: media-cors
spec:
  headers:
    accessControlAllowMethods:
      - GET
      - OPTIONS
    accessControlAllowOriginList:
      - "https://hub.${ENV_SUBDOMAIN}${WODORE_HOST}"
      - "https://${ENV_SUBDOMAIN}${WODORE_HOST}"
      - "https://hub.${ENV_SUBDOMAIN}${WODO_HOST}"
      - "https://${ENV_SUBDOMAIN}${WODO_HOST}"
      - "https://wodore.github.io"
    accessControlMaxAge: 86400
---
# API response compression (gzip via Traefik, negotiated by
# Accept-Encoding; >=1 KiB bodies only, already-encoded responses are
# skipped). The geo image endpoints return ~100 KiB GeoJSON that shrinks
# ~5x. Compressing at Traefik keeps the cost off the Django worker's
# single sync executor (Python gzip there would serialize behind every
# sync view).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: api-compress
spec:
  compress: {}
---
# Media files - served by nginx sidecar with CORS headers
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wd-backend-media
  annotations:
    cert-manager.io/cluster-issuer: ${CERT_ISSUER_PROD}
    # yamllint disable rule:line-length
    traefik.ingress.kubernetes.io/router.middlewares: ${NAMESPACE}-media-cors@kubernetescrd
    # yamllint enable rule:line-length
spec:
  rules:
    - host: hub.${ENV_SUBDOMAIN}${WODORE_HOST}
      http:
        paths:
          - path: /media
            pathType: Prefix
            backend:
              service:
                name: wd-backend-media
                port:
                  number: 80
  tls:
    - secretName: wd-backend-${ENVIRONMENT}-tls
      hosts:
        - hub.${ENV_SUBDOMAIN}${WODORE_HOST}
---
# Django backend API - no CORS middleware (handled by Django)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wd-backend
  annotations:
    cert-manager.io/cluster-issuer: ${CERT_ISSUER_PROD}
    # yamllint disable rule:line-length
    traefik.ingress.kubernetes.io/router.middlewares: ${NAMESPACE}-api-compress@kubernetescrd
    # yamllint enable rule:line-length
spec:
  rules:
    - host: hub.${ENV_SUBDOMAIN}${WODORE_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wd-backend-api
                port:
                  number: 8008
  tls:
    - secretName: wd-backend-${ENVIRONMENT}-tls
      hosts:
        - hub.${ENV_SUBDOMAIN}${WODORE_HOST}
