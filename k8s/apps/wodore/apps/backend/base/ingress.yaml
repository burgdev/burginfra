apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wd-backend
  annotations:
    cert-manager.io/cluster-issuer: ${CERT_ISSUER_PROD}
spec:
  rules:
    - host: api.${ENV_SUBDOMAIN}${WODORE_HOST}
      http:
        paths:
          # Media files served by nginx (higher priority)
          - path: /media
            pathType: Prefix
            backend:
              service:
                name: wd-backend-media
                port:
                  number: 80
          # Django backend (catch-all)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wd-backend-api
                port:
                  number: 8008
  tls:
    - secretName: wd-backend-${ENVIRONMENT}-tls
      hosts:
        - api.${ENV_SUBDOMAIN}${WODORE_HOST}
