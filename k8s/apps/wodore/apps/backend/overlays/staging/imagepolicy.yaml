# ImagePolicy for staging environment - uses latest sha-tagged image
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: wd-backend
  namespace: staging
spec:
  imageRepositoryRef:
    name: wd-backend
  filterTags:
    pattern: "^sha-[a-f0-9]+-alpine$" # Match sha-abc123-alpine pattern
  policy:
    numerical:
      order: asc # Sort by image creation timestamp (oldest to newest, latest selected)

