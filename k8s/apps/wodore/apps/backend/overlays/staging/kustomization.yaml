apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - imagepolicy.yaml
patches:
  - path: deployment-cors-origins.yaml
    target:
      kind: Deployment
      name: wd-backend
  # Image entrypoint chain + ASGI runtime (backend #263/#259/#264);
  # see the file header for the prod-promotion plan
  - path: deployment-entrypoint.yaml
    target:
      kind: Deployment
      name: wd-backend
  # Sync HUT_SRV_* source credentials (hut-services DOC NZ API key) from
  # OpenBao into wd-backend-envvars — see the patch file header
  - path: vso-backend-envvars-hutsrv.yaml
    target:
      group: secrets.hashicorp.com
      version: v1beta1
      kind: VaultStaticSecret
      name: wd-backend-envvars
