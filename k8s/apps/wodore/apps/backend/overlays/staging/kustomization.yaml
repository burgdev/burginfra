apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - imagepolicy.yaml
patches:
  - path: job-migrate-bootstrap.yaml
    target:
      kind: Job
      name: wd-backend-migrate
  - path: deployment-cors-origins.yaml
    target:
      kind: Deployment
      name: wd-backend
  # Image entrypoint chain + ASGI runtime (backend #263/#259/#264);
  # see the file header for the prod-promotion plan
  - path: deployment-entrypoint.yaml
    target:
      kind: Deployment
      name: wd-backend
