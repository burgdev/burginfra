# Staging-only: allow Capacitor app (Android/iOS) WebView origins for
# media fetches - same two origins as the Django CORS change in
# wodore-backend (CORS_ALLOWED_ORIGINS in environments/staging.py).
# JSON6902 add-ops append to the base list (strategic merge would
# replace it wholesale). Reverted/extended when the app ships.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: media-cors
patch: |-
  - op: add
    path: /spec/headers/accessControlAllowOriginList/-
    value: capacitor://localhost
  - op: add
    path: /spec/headers/accessControlAllowOriginList/-
    value: https://localhost
