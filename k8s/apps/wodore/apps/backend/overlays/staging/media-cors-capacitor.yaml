# Staging-only: append the Capacitor app (Android/iOS) WebView origins to
# the media-cors middleware origin list - iOS sends capacitor://localhost,
# Android (scheme https + hostname localhost) sends https://localhost.
# JSON6902 add-ops append to the base list (a strategic-merge patch would
# replace it wholesale). Companion to the Django CORS change in
# wodore-backend (CORS_ALLOWED_ORIGINS, environments/staging.py).
- op: add
  path: /spec/headers/accessControlAllowOriginList/-
  value: capacitor://localhost
- op: add
  path: /spec/headers/accessControlAllowOriginList/-
  value: https://localhost
- op: add
  path: /spec/headers/accessControlAllowOriginList/-
  value: w://localhost
