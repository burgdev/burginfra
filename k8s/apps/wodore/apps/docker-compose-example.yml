volumes:
  db-api-pgdata: # django
  db-umami-pgdata:
  db-zitadel-pgdata: # zitaldel
#django-media:

name: wodore-server

networks:
  backend:
  proxy:
    name:
      proxy
      #external: true
  umami:
  zitadel:

services:
  ###############################################################################
  ## TRAEFIK                                                traefik.wodore.com ##
  traefik:
    env_file:
      - .env
    image: traefik:v3.5
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
        #network_mode:
    healthcheck:
      #test: /bin/bash -c "timeout 1 bash -c '</dev/tcp/localhost/80' 2>/dev/null"
      #test: ["CMD", "healthcheck"]
      test: ["CMD", "true"] # only for dependency
      interval: 60s
      timeout: 5s
      retries: 5
      start_period:
        10s
        #network_mode: "host"  # Use host networking
    networks:
      - proxy
    ports:
      - 80:80
      - 443:443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
      - ./traefik/traefik.yml:/traefik.yml:ro
      - ./traefik/acme.json:/acme.json
      - ./traefik/config.yml:/config.yml:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.entrypoints=http
      - traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN}`) || Host(`traefik.${DOMAIN2}`)
       #- traefik.http.routers.traefik.rule=HostRegexp(`^traefik.(${DOMAINS})$`)
      - traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_USERPASS}
      - traefik.http.middlewares.traefik-https-redirect.redirectscheme.scheme=https
      - traefik.http.routers.traefik.middlewares=traefik-https-redirect
      - traefik.http.routers.traefik-secure.entrypoints=https
      - traefik.http.routers.traefik-secure.rule=Host(`traefik.${DOMAIN}`) || Host(`traefik.${DOMAIN2}`)
        #- traefik.http.routers.traefik-secure.rule=HostRegexp(`^traefik.(${DOMAINS})$`)
      - traefik.http.routers.traefik-secure.middlewares=traefik-auth
      - traefik.http.routers.traefik-secure.tls=true
      - traefik.http.routers.traefik-secure.tls.certresolver=http
      - traefik.http.routers.traefik-secure.service=api@internal
      - traefik.http.services.portainer.loadbalancer.server.port=80
    logging:
      options:
        max-size: "50m"
        max-file: "3"

  ###############################################################################
  ## BACKEND                                                        api.wodore ##
  api.wodore:
    container_name: wodore-backend
    image: "ghcr.io/wodore/wodore-backend:edge-alpine"
    restart: unless-stopped
    pull_policy: always
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
      - backend
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./.volumes/media:/code/media
      - ./.volumes/backend/py_cache:/tmp/py_file_cache/joblib
    env_file: wodore-backend/.env.prod
    environment:
      DJANGO_ENV: production
      #DJANGO_ENV: dev_production
      #DJANGO_ENV: development
      DJANGO_DATABASE_HOST: db
        #dns:
        #  - 8.8.8.8
        #  - 1.1.1.1
    depends_on:
      db:
        condition: service_healthy
      traefik:
        condition: service_healthy
    command:
      gunicorn -b 0.0.0.0:8008 -w 3 --preload server.wsgi:application
      #python -Wd manage.py runserver 0.0.0.0:8008
      #healthcheck:
      #  # We use `$$` here because:
      #  # one `$` goes to shell,
      #  # one `$` goes to `docker-compose.yml` escaping
      #  # this does not work, since api.DOMAIN is not ready yet, maybe use:
      #  #   - https://github.com/revsys/django-health-check
      #  #   - see: https://github.com/cookiecutter/cookiecutter-django/issues/4428
      #  test: /bin/bash -c "timeout 1 bash -c '</dev/tcp/localhost/8008' 2>/dev/null"
      #  #test: |
      #  #  /usr/bin/test $$(
      #  #  /usr/bin/curl --insecure --fail http://0.0.0.0:8008/health/?format=json
      #  #    --write-out "%{http_code}" --silent --output /dev/null
      #  #  ) -eq 200
      #  interval: 60s
      #  timeout: 5s
      #  retries: 3
      #  start_period: 10s
    logging:
      options:
        max-size: "50m"
        max-file: "3"
    labels:
      - traefik.enable=true
      - traefik.http.routers.wodore-backend.entrypoints=http
      - traefik.http.routers.wodore-backend.rule=Host(`api.${DOMAIN}`) || Host(`api.${DOMAIN2}`)
        #- traefik.http.routers.wodore-backend.rule=HostRegexp(`^api.(${DOMAINS})$`)
      - traefik.http.middlewares.wodore-backend-https-redirect.redirectscheme.scheme=https
      - traefik.http.routers.wodore-backend.middlewares=wodore-backend-https-redirect
      - traefik.http.routers.wodore-backend-secure.entrypoints=https
      - traefik.http.routers.wodore-backend-secure.rule=Host(`api.${DOMAIN}`) || Host(`api.${DOMAIN2}`)
        # - traefik.http.routers.wodore-backend-secure.rule=HostRegexp(`^api.(${DOMAINS})$`)
      - traefik.http.routers.wodore-backend-secure.tls=true
      - traefik.http.routers.wodore-backend-secure.tls.certresolver=http
      - traefik.http.routers.wodore-backend-secure.service=wodore-backend
      - traefik.http.services.wodore-backend.loadbalancer.server.port=8008
      - traefik.docker.network=proxy

  api.wodore-media:
    image: flashspys/nginx-static
    container_name: wodore-backend-media
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./.volumes/backend:/static
        #- ./wodore-frontend/index.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      traefik:
        condition: service_healthy
    logging:
      options:
        max-size: "50m"
        max-file: "3"
    labels:
      - traefik.enable=true
      - traefik.http.routers.wodore-backend-media.entrypoints=http
      - "traefik.http.routers.wodore-backend-media.rule=Host(`api.${DOMAIN}`) && PathPrefix(`/media`) || Host(`api.${DOMAIN2}`) && PathPrefix(`/media`)"
        # - "traefik.http.routers.wodore-backend-media.rule=HostRegexp(`^api.(${DOMAINS})$`) && PathPrefix(`/media`)"
      - traefik.http.middlewares.wodore-backend-media-https-redirect.redirectscheme.scheme=https
      - traefik.http.routers.wodore-backend-media.middlewares=wodore-backend-media-https-redirect
      - traefik.http.routers.wodore-backend-media-secure.entrypoints=https
      - "traefik.http.routers.wodore-backend-media-secure.rule=Host(`api.${DOMAIN}`) && PathPrefix(`/media`) || Host(`api.${DOMAIN2}`) && PathPrefix(`/media`)"
        # - "traefik.http.routers.wodore-backend-media-secure.rule=HostRegexp(`^api.(${DOMAINS})$`) && PathPrefix(`/media`)"
      - traefik.http.routers.wodore-backend-media-secure.tls=true
      - traefik.http.routers.wodore-backend-media-secure.tls.certresolver=http
      - traefik.http.routers.wodore-backend-media-secure.service=wodore-backend-media
      - traefik.http.services.wodore-backend-media.loadbalancer.server.port=80
      - traefik.docker.network=proxy

  ###############################################################################
  ## DATABASE (backend)                                               internal ##
  db:
    container_name: db
    image: "postgis/postgis:16-3.5-alpine"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      # - ./data/backend/pgdata:/var/lib/postgresql/data
      - db-api-pgdata:/var/lib/postgresql/data
    networks:
      - backend
        #- traefik
    env_file:
      wodore-backend/.env.prod
      #ports:
      #  - "5432:5432"
    expose:
      - 5432
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 60s
      retries: 5
      start_period: 10s
    labels:
      - "db-backup-runner.enable=true"

  ###############################################################################
  ## BACKUP                                                           internal ##
  backup-cron:
    #image: ghcr.io/burgdev/db-backup-runner:latest
    image: ghcr.io/burgdev/db-backup-runner:edge
    container_name: backup-cron
    pull_policy: always
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro" # required
      - ./.volumes/dbbackups:/tmp/db_backup_runner # backup directory
    environment:
      # https://crontab.guru
      DB_BACKUP_CRON: "0 4 * * *" # at 4am every day
      # DB_BACKUP_CRON: "*/2 * * * *" # every 2nd minute
      DB_BACKUP_WEBHOOK: ${WEBHOOK}
    networks:
      - backend
    depends_on:
      - db
      - umami-db
      - zitadel-db
    command: "--verbose backup-cron --on-startup" # optional

  ###############################################################################
  ## FRONTEND                                                          wodo.re ##
  wodore.com:
    image: ghcr.io/wodore/wodore-frontend-quasar:edge-pwa
    container_name: wodore-frontend-quasar
    restart: unless-stopped
    pull_policy: always
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    volumes:
      - /etc/localtime:/etc/localtime:ro
    env_file: wodore-frontend/.env.prod
    depends_on:
      traefik:
        condition: service_healthy
    logging:
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      NGINX_CONFIG: nginx-proxy.conf
    labels:
      - traefik.enable=true
      - traefik.http.routers.wodore-frontend-quasar.entrypoints=http
      - traefik.http.routers.wodore-frontend-quasar.rule=Host(`${DOMAIN}`) || Host(`${DOMAIN2}`)
        # - traefik.http.routers.wodore-frontend-quasar.rule=HostRegexp(`^(${DOMAINS})$`)
      - traefik.http.middlewares.wodore-frontend-quasar-https-redirect.redirectscheme.scheme=https
      - traefik.http.routers.wodore-frontend-quasar.middlewares=wodore-frontend-quasar-https-redirect
        #,remove-user-agent
      - traefik.http.routers.wodore-frontend-quasar-secure.entrypoints=https
      - traefik.http.routers.wodore-frontend-quasar-secure.rule=Host(`${DOMAIN}`) || Host(`${DOMAIN2}`)
        # - traefik.http.routers.wodore-frontend-quasar-secure.rule=HostRegexp(`^(${DOMAINS})$`)
      - traefik.http.routers.wodore-frontend-quasar-secure.tls=true
      - traefik.http.routers.wodore-frontend-quasar-secure.tls.certresolver=http
      - traefik.http.routers.wodore-frontend-quasar-secure.service=wodore-frontend-quasar
        # - traefik.http.routers.wodore-frontend-quasar-secure.middlewares=remove-user-agent
      - traefik.http.services.wodore-frontend-quasar.loadbalancer.server.port=8080
      - traefik.docker.network=proxy
        #- traefik.http.middlewares.remove-user-agent.headers.customrequestheaders.User-Agent=

  ###############################################################################
  ## IMAGES                                                     img.wodore.com ##
  img.wodore:
    image: shumc/imagor:1.5.12
    container_name: imagor
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      # - ../../../wodore-backend/media:/mnt/data/source/media
      - ./.volumes/backend/media:/mnt/data/source/media
      - ./.volumes/imagor/data/storage:/mnt/data/storage
      - ./.volumes/imagor/data/result:/mnt/data/result
    environment:
      PORT: 8072
      DEBUG: 0
      IMAGOR_UNSAFE: 0 # unsafe URL for testing
      IMAGOR_SECRET: ${IMAGOR_SECRET}
      IMAGOR_AUTO_WEBP: 1
      IMAGOR_AUTO_ACIF: 1
      IMAGOR_SIGNER_TYPE:
        sha256
        #IMAGOR_SIGNER_TRUNCATE: 40

      FILE_LOADER_BASE_DIR: /mnt/data/source # enable file loader by specifying base dir

      FILE_STORAGE_BASE_DIR: /mnt/data/storage # enable file storage by specifying base dir
      FILE_STORAGE_MKDIR_PERMISSION: 0755 # optional
      FILE_STORAGE_WRITE_PERMISSION: 0666 # optional

      FILE_RESULT_STORAGE_BASE_DIR: /mnt/data/result # enable file result storage by specifying base dir
      FILE_RESULT_STORAGE_MKDIR_PERMISSION: 0755 # optional
      FILE_RESULT_STORAGE_WRITE_PERMISSION: 0666 # optional
      IMAGOR_RESULT_STORAGE_PATH_STYLE: size
    depends_on:
      traefik:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8072:8072"
    labels:
      - traefik.enable=true
      - traefik.http.routers.imagor.entrypoints=http
      - traefik.http.routers.imagor.rule=Host(`img.${DOMAIN}`) || Host(`img.${DOMAIN2}`)
        # - traefik.http.routers.imagor.rule=HostRegexp(`^img.(${DOMAINS})$`)
      - traefik.http.middlewares.imagor-https-redirect.redirectscheme.scheme=https
      - traefik.http.routers.imagor.middlewares=imagor-https-redirect
      - traefik.http.routers.imagor-secure.entrypoints=https
      - traefik.http.routers.imagor-secure.rule=Host(`img.${DOMAIN}`) || Host(`img.${DOMAIN2}`)
        # - traefik.http.routers.imagor-secure.rule=HostRegexp(`^img.(${DOMAINS})$`)
      - traefik.http.routers.imagor-secure.tls=true
      - traefik.http.routers.imagor-secure.tls.certresolver=http
      - traefik.http.routers.imagor-secure.service=imagor
      - traefik.http.services.imagor.loadbalancer.server.port=8072
      - traefik.docker.network=proxy

  ###############################################################################
  ## UMAMI                                                    stats.wodore.com ##
  umami:
    image: ghcr.io/umami-software/umami:postgresql-v2.17
    container_name: umami
    ports:
      - "3000:3000"
    pull_policy: always
    environment:
      DATABASE_URL: postgresql://umami:umami@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET}
    depends_on:
      umami-db:
        condition: service_healthy
      traefik:
        condition: service_healthy
    networks:
      - proxy
      - umami
    restart:
      unless-stopped
      #volumes:
      #healthcheck:
      #  test: ["CMD-SHELL", "curl http://localhost:3000/api/heartbeat"]
      #  interval: 5s
      #  timeout: 5s
      #  retries: 5
    logging:
      options:
        max-size: "50m"
        max-file: "3"
    labels:
      - traefik.enable=true
      - traefik.http.routers.umami.entrypoints=http
      - traefik.http.routers.umami.rule=Host(`stats.${DOMAIN}`) || Host(`stats.${DOMAIN2}`)
        # - traefik.http.routers.umami.rule=HostRegexp(`^stats.(${DOMAINS})$`)
      - traefik.http.middlewares.umami-https-redirect.redirectscheme.scheme=https
      - traefik.http.routers.umami.middlewares=umami-https-redirect
        #,remove-user-agent
      - traefik.http.routers.umami-secure.entrypoints=https
      - traefik.http.routers.umami-secure.rule=Host(`stats.${DOMAIN}`) || Host(`stats.${DOMAIN2}`)
        # - traefik.http.routers.umami-secure.rule=HostRegexp(`^stats.(${DOMAINS})$`)
      - traefik.http.routers.umami-secure.tls=true
      - traefik.http.routers.umami-secure.tls.certresolver=http
      - traefik.http.routers.umami-secure.service=umami
      - traefik.http.services.umami.loadbalancer.server.port=3000
      - traefik.docker.network=proxy

  umami-db:
    image: postgres:15-alpine
    container_name: umami-db
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami
    networks:
      - umami
    volumes:
      - db-umami-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 60s
      retries: 5
      start_period: 10s
    labels:
      - "db-backup-runner.enable=true"

  ###############################################################################
  ## ZITADEL                                                    iam.wodore.com ##
  zitadel:
    container_name: zitadel
    image: "ghcr.io/zitadel/zitadel:v2.71.4"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pull_policy: always
    networks:
      - proxy
      - zitadel
    env_file:
      - .env
    command: "start-from-init --config /zitadel-config.yml --config /zitadel-secrets.yml --steps /zitadel-init-steps.yml --masterkeyFile /zitadel-masterkey --tlsMode external"
    depends_on:
      - db
      - traefik
    volumes:
      - "./zitadel/zitadel-config.yml:/zitadel-config.yml:ro"
      - "./zitadel/zitadel-secrets.yml:/zitadel-secrets.yml:ro"
      - "./zitadel/zitadel-init-steps.yml:/zitadel-init-steps.yml:ro"
      - "./zitadel/.zitadel-masterkey:/zitadel-masterkey:ro"
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    logging:
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      ZITADEL_EXTERNALDOMAIN: "iam.${DOMAIN}"
    labels:
      - traefik.enable=true
      - traefik.http.routers.zitadel.entrypoints=http
        #- traefik.http.routers.zitadel.rule=HostRegexp(`iam.${DOMAIN}|wodore.iam.${DOMAIN}`)
        #- traefik.http.routers.zitadel.rule=HostRegexp(`^iam.(${DOMAINS})|wodore.iam.(${DOMAINS})$`)
      - traefik.http.routers.zitadel.rule=Host(`iam.${DOMAIN}`) || Host(`iam.${DOMAIN2}`) || Host(`wodore.iam.${DOMAIN}`) || Host(`wodore.iam.${DOMAIN2}`)
      - traefik.http.middlewares.zitadel-https-redirect.redirectscheme.scheme=https
      - traefik.http.routers.zitadel.middlewares=zitadel-https-redirect
      - traefik.http.middlewares.zitadel-headers.headers.isdevelopment=false
      - traefik.http.middlewares.zitadel-headers.headers.customrequestheaders.authority=`iam.${DOMAIN}`
        #- traefik.http.middlewares.zitadel-headers.headers.allowedhosts=`iam.${DOMAIN}`
      - traefik.http.routers.zitadel-secure.entrypoints=https
        #- traefik.http.routers.zitadel-secure.rule=HostRegexp(`iam.${DOMAIN}|wodore.iam.${DOMAIN}`)
        #- traefik.http.routers.zitadel-secure.rule=HostRegexp(`^iam.(${DOMAINS})|wodore.iam.(${DOMAINS})$`)
      - traefik.http.routers.zitadel-secure.rule=Host(`iam.${DOMAIN}`) || Host(`iam.${DOMAIN2}`) || Host(`wodore.iam.${DOMAIN}`) || Host(`wodore.iam.${DOMAIN2}`)
      - traefik.http.routers.zitadel-secure.tls=true
      - traefik.http.routers.zitadel-secure.tls.certresolver=http
        #- traefik.http.routers.zitadel-secure.tls.domains[0].main=iam.${DOMAIN}
        #- traefik.http.routers.zitadel-secure.tls.domains[0].sans=*.iam.${DOMAIN}
      - traefik.http.routers.zitadel-secure.service=zitadel
      - traefik.http.routers.zitadel-secure.middlewares=zitadel-headers
      - traefik.http.services.zitadel.loadbalancer.server.port=8080
      - traefik.http.services.zitadel.loadbalancer.server.scheme=h2c
      - traefik.http.services.zitadel.loadbalancer.passhostheader=true
      - traefik.docker.network=proxy

  zitadel-db:
    container_name: zitadel-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=postgres
        #ports:
        #  - '5432:5432'
    expose:
      - "5433" # Publishes 5432 to other containers but NOT to host machine
    networks:
      - zitadel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "db_prod"]
      interval: 10s
      timeout: 60s
      retries: 5
      start_period: 10s
    volumes:
      - "db-zitadel-pgdata:/var/lib/postgresql/data:rw"
    labels:
      - "db-backup-runner.enable=true"

  ###############################################################################
  ## PORTAINER                                            portainer.wodore.com ##
  portainer:
    env_file:
      - .env
    image: portainer/portainer-ce:alpine-sts
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./.volumes/portainer/data:/data
    depends_on:
      traefik:
        condition: service_healthy
    logging:
      options:
        max-size: "100m"
        max-file: "3"
    labels:
      - traefik.enable=true
      - traefik.http.routers.portainer.entrypoints=http
      - traefik.http.routers.portainer.rule=Host(`portainer.${DOMAIN}`) || Host(`portainer.${DOMAIN2}`)
        # - traefik.http.routers.portainer.rule=HostRegexp(`^portainer.(${DOMAINS})$`)
      - traefik.http.middlewares.portainer-https-redirect.redirectscheme.scheme=https
      - traefik.http.routers.portainer.middlewares=portainer-https-redirect
      - traefik.http.routers.portainer-secure.entrypoints=https
      - traefik.http.routers.portainer-secure.rule=Host(`portainer.${DOMAIN}`) || Host(`portainer.${DOMAIN2}`)
        # - traefik.http.routers.portainer-secure.rule=HostRegexp(`^portainer.(${DOMAINS})$`)
      - traefik.http.routers.portainer-secure.tls=true
      - traefik.http.routers.portainer-secure.tls.certresolver=http
      - traefik.http.routers.portainer-secure.service=portainer
      - traefik.http.services.portainer.loadbalancer.server.port=9000
      - traefik.docker.network=proxy

  ###############################################################################
  ## S3PROXY                                                     s3.wodore.com ##
  ## read (public)
  s3proxy-read:
    env_file:
      - .env
    image: rclone/rclone:latest
    container_name: s3proxy-read
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    security_opt:
      - no-new-privileges:true
