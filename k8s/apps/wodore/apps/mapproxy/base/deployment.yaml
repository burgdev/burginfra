apiVersion: apps/v1
kind: Deployment
metadata:
  name: wd-mapproxy
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 60
  # Recreate, not RollingUpdate: a 1-replica pod on a ReadWriteOnce PVC
  # cannot surge (the new pod can't attach the volume the old one still
  # holds), which deadlocks rollouts. The tile cache survives, so the
  # replacement pod serves warm from its first request.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wd-mapproxy
  template:
    metadata:
      labels:
        app: wd-mapproxy
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      containers:
        - name: wd-mapproxy
          # -nginx variant: official image running mapproxy behind nginx
          # on port 80. Config is read once at startup — the
          # hash-suffixed ConfigMap (configMapGenerator) rolls the pod
          # on every config change.
          image: ghcr.io/mapproxy/mapproxy/mapproxy:7.0.0-nginx
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            # LINZ Basemaps API key for the nz_topo50 / nz_aerial
            # sources in mapproxy.yaml - MapProxy 7.0.0 expands
            # $MAP_LINZ_API_KEY into the tile URLs at config load.
            # mapproxy.yaml spells it $$MAP_LINZ_API_KEY: flux
            # postBuild (envsubst) renders $$ as a literal $ - bare
            # $VAR blocks the apply ("unable to parse variable name")
            # and ${VAR} gets silently emptied to "?api=" (which
            # 400-ed every LINZ fetch into the on_error fallback for
            # a day).
            # The key lives in OpenBao kv/apps/wodore/staging and
            # reaches this pod through the backend's VSO-synced secret
            # wd-backend-envvars (same namespace; MAP_* keys are let
            # through the includes filter by the wodore staging
            # overlay patch). optional: true keeps environments
            # without the key (production until it is added to
            # kv/apps/wodore/production) bootable - MapProxy keeps
            # the literal placeholder and the NZ sources' on_error
            # degrades world_topo/world_satellite to OpenTopoMap/Esri.
            # Rotation note: env vars are read at pod start only
            # (wd-backend-envvars sets no rolloutRestartTargets), so a
            # rotated key needs a manual `kubectl rollout restart` of
            # wd-mapproxy (and wd-backend).
            - name: MAP_LINZ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wd-backend-envvars
                  key: MAP_LINZ_API_KEY
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /mapproxy/config
              readOnly: true
            # nested mount: kubelet mounts deepest-first, so the cache
            # PVC overlays the read-only ConfigMap dir
            - name: cache
              mountPath: /mapproxy/config/cache_data
          startupProbe:
            httpGet:
              path: /mapproxy/tms/1.0.0/
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /mapproxy/tms/1.0.0/
              port: http
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 15
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: wd-mapproxy-config
        - name: cache
          persistentVolumeClaim:
            claimName: wd-mapproxy-cache
