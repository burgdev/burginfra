# yamllint disable rule:line-length
# Wodore "World Topo" tile service config (MapProxy 7.0.0)
#
# Serves two merged raster basemap layers (names are world_*, the
# coverage is genuinely worldwide - Esri imagery + OpenTopoMap global):
#
#   world_topo   OpenTopoMap worldwide; BEV Austrian Map (AT) and
#                 swisstopo (CH/LI) merged on top from zoom 7 up,
#                 Plan IGN (FR) + LINZ topo-raster (NZ) from zoom 6
#
# BEV Austrian Map online (ÖK render, z5-z16) is clipped to the
# Austria polygon and swisstopo pixelkarte to the
# Switzerland+Liechtenstein polygon - pixel-perfect country cuts at
# the borders, no white no-data areas, no bbox seams.
# Both country sources carry min_res: below z7 MapProxy returns blank
# images for them and the layer falls back to pure OpenTopoMap - so
# full-country views stay OpenTopoMap-only.
#
#   demo:  https://tiles.<host>/mapproxy/demo/
#   tiles: https://tiles.<host>/mapproxy/tiles/world_topo/webmercator/{z}/{x}/{y}.webp
#
# The /tiles endpoint serves plain XYZ order (top-left origin) - usable
# as a MapLibre raster source without scheme:'tms'. The cache stores
# and serves JPEG (merge internally with alpha via request_format, then
# encode) - only the .webp extension is routable, the raster URL
# template must end in .webp.
#
# MapProxy 7.0.0 gotchas learned the hard way (verified in the
# wd-europe-topo prototype and locally against this exact image):
# - layers must reference a SINGLE cache (multi-cache layer merge is
#   8.0+); merging multiple sources works at the CACHE level instead
# - tile sources do NOT support min_level/max_level ("unknown" warning,
#   silently ignored) - use max_res/min_res instead (blank outside the
#   resolution range)
# - services.tms.expires_hours is ALSO unknown in this build (warning,
#   ignored) - browser cache headers come from the nginx tier instead
# - WebP is impossible: Pillow in the image has the webp codec, but
#   MapProxy core has no webp encoder - tiles 404 under any webp cache
#   format (verified against ghcr and kartoza images)
# - do NOT override num_levels on a based grid - startup hangs
# - mbtiles caches failed to initialize; default file cache works fine
services:
  demo:
  tms:
    use_grid_names: true
    # nw origin => the /tiles endpoint serves XYZ order (top-left)
    origin: 'nw'
grids:
  webmercator:
    # GLOBAL_WEBMERCATOR = EPSG:3857 with nw (top-left) origin - the
    # XYZ convention used by the upstream tile servers
    base: GLOBAL_WEBMERCATOR
sources:
  opentopo:
    type: tile
    url: https://b.tile.opentopomap.org/%(z)s/%(x)s/%(y)s.png
    grid: webmercator
    transparent: true
  at_bev_karte:
    type: tile
    # BEV "Austrian Map online" topo (ÖK50/ÖK250/ÖK500 render, 256px
    # PNG, plain XYZ order, z5-z16). Declared CC BY 4.0 in the BEV
    # data catalog (DOI 10.48677/2fe7eed6-ab55-4926-a4a1-80df6dedc55c);
    # the www.bev.gv.at product page still carries legacy
    # redistribution wording - written confirmation from BEV
    # Kundenservice requested 2026-10. Attribution: "Datenquelle: BEV".
    # Operational caveats: upstream is a Werkzeug dev server sending
    # Cache-Control: no-cache (our cache tiers absorb that) and tiles
    # stop at z16 - the FRONTEND raster source must set maxzoom: 16 so
    # z17+ overzooms this layer instead of falling through to
    # OpenTopoMap mid-zoom (frontend repo change, lands with this).
    # on_error keeps OpenTopoMap as graceful fallback on BEV hiccups.
    url: https://maps.bev.gv.at/tiles/karte/%(z)s/%(x)s/%(y)s.png
    grid: webmercator
    transparent: true
    # active from z7 up (min_res; res(7) = 1222.99 m/px) -
    # OpenTopoMap renders the small scales for the whole map.
    min_res: 1223
    on_error:
      404:
        response: transparent
        cache: true
    coverage:
      datasource: /mapproxy/config/at-boundary.geojson
      srs: 'EPSG:4326'
      clip: true
  ch_pixelkarte:
    type: tile
    url: https://wmts0.geo.admin.ch/1.0.0/ch.swisstopo.pixelkarte-farbe/default/current/3857/%(z)s/%(x)s/%(y)s.jpeg
    grid: webmercator
    transparent: true
    # active from z7 up (see at_bev_karte).
    min_res: 1223
    on_error:
      400:
        response: transparent
        cache: true
      404:
        response: transparent
        cache: true
    # clip to the country polygon: everything outside becomes transparent
    # pixels, so OpenTopoMap below shows through with a clean border cut.
    # ch-boundary.geojson = Natural Earth 10m country polygons (public
    # domain, ~1km precision), Switzerland + Liechtenstein (swisstopo
    # renders LI too); swap in swisstopo swissBOUNDARIES3D for
    # survey-grade borders.
    coverage:
      datasource: /mapproxy/config/ch-boundary.geojson
      srs: 'EPSG:4326'
      clip: true
  ign_plan:
    type: tile
    # IGN "Plan IGN v2" via the Geoplateforme (data.geopf.fr), modern
    # flat "plan" render. Licence Ouverte/Etalab 2.0 - commercial use
    # and redistribution OK, so cacheable + re-servable.
    # No API key: data.geopf.fr serves this open-data layer anonymously
    # (verified keyless HTTP 200; the old IGN_API_KEY did nothing).
    # SCAN25 Touristique is NOT available here - the layer returns
    # "unknown" on data.geopf.fr and the product is licensed (not
    # open), needing a cartes.gouv.fr HASH key sent as an HTTP header
    # plus an IGN rediffusion license. Neither is wired up; tracked
    # as a licensing question with IGN - do not swap in blindly.
    url: https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&STYLE=normal&TILEMATRIXSET=PM&TILEMATRIX=%(z)s&TILEROW=%(y)s&TILECOL=%(x)s&FORMAT=image/png
    grid: webmercator
    transparent: true
    # France shows one level earlier than AT/CH: from z6 up
    # (res(6) = 2445.98 m/px).
    min_res: 2446
    on_error:
      404:
        response: transparent
        cache: true
    # Natural Earth 10m France polygon (metropolitan + Corsica).
    coverage:
      datasource: /mapproxy/config/fr-boundary.geojson
      srs: 'EPSG:4326'
      clip: true
  nz_topo50:
    type: tile
    # LINZ Basemaps "topo-raster" = NZ Topo50/Topo250 Gridless raster
    # mosaic (CC BY 4.0, attribution "CC BY 4.0 Land Information New
    # Zealand"). NZ-only coverage (mainland + Chathams + offshore
    # islands; see nz-boundary.geojson), z6-z21, png/jpeg/webp.
    # The API key rides in the query string: MapProxy 7.0.0 expands
    # ${MAP_LINZ_API_KEY} from the process env at config load (secret
    # wd-backend-envvars <- OpenBao kv/apps/wodore/staging; MAP_* let
    # through the VSO includes filter by the wodore staging overlay).
    # If the env is unset (production until the key lands there) the
    # literal placeholder is kept, LINZ answers 400/403 - handled
    # below, world_topo falls back to OpenTopoMap. LINZ Kundenservice
    # confirmed server-side caching is fine (attribution only) and
    # suggests re-fetching tiles ~every 6 months (weekly tile
    # updates) - well within the 4-week refresh_before below.
    url: https://basemaps.linz.govt.nz/v1/tiles/topo-raster/3857/%(z)s/%(x)s/%(y)s.png?api=${MAP_LINZ_API_KEY}
    grid: webmercator
    transparent: true
    # active from z6 up (res(6) = 2445.98 m/px), like ign_plan - the
    # national mosaic starts at z6.
    min_res: 2446
    on_error:
      400:
        response: transparent
        cache: true
      403:
        response: transparent
        cache: true
      404:
        response: transparent
        cache: true
    coverage:
      datasource: /mapproxy/config/nz-boundary.geojson
      srs: 'EPSG:4326'
      clip: true
  # --- Satellite imagery (world_satellite) ---
  esri_world:
    type: tile
    # Global fallback: Esri World Imagery. Attribution required
    # ("Esri, Maxar, Earthstar Geographics, and the GIS User Community").
    # Reconsider for commercial scale-up (Esri terms).
    url: https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/%(z)s/%(y)s/%(x)s
    grid: webmercator
    transparent: false
  at_ortho:
    type: tile
    # basemap.at orthophoto 30cm/15cm (CC BY 4.0). NOTE: layer name is
    # bmaporthofoto30cm (not bmaporthofoto) and the extension .jpeg,
    # per the WMTSCapabilities resource templates.
    url: https://mapsneu.wien.gv.at/basemap/bmaporthofoto30cm/normal/google3857/%(z)s/%(y)s/%(x)s.jpeg
    grid: webmercator
    transparent: true
    min_res: 1223
    on_error:
      404:
        response: transparent
        cache: true
    coverage:
      datasource: /mapproxy/config/at-boundary.geojson
      srs: 'EPSG:4326'
      clip: true
  ch_swissimage:
    type: tile
    # swisstopo swissimage 10cm (swisstopo OGD, commercial OK), CH+LI.
    url: https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.swissimage/default/current/3857/%(z)s/%(x)s/%(y)s.jpeg
    grid: webmercator
    transparent: true
    min_res: 1223
    on_error:
      404:
        response: transparent
        cache: true
    coverage:
      datasource: /mapproxy/config/ch-boundary.geojson
      srs: 'EPSG:4326'
      clip: true
  fr_ortho:
    type: tile
    # IGN BD ORTHO (Licence Ouverte/Etalab 2.0) via geopf. No API key
    # - open-data layer served anonymously by data.geopf.fr (verified
    # keyless HTTP 200; the old IGN_API_KEY did nothing).
    url: https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&STYLE=normal&TILEMATRIXSET=PM&TILEMATRIX=%(z)s&TILEROW=%(y)s&TILECOL=%(x)s&FORMAT=image/jpeg
    grid: webmercator
    transparent: true
    min_res: 1223
    on_error:
      404:
        response: transparent
        cache: true
    coverage:
      datasource: /mapproxy/config/fr-boundary.geojson
      srs: 'EPSG:4326'
      clip: true
  nz_aerial:
    type: tile
    # LINZ Basemaps aerial imagery (latest national mosaic, rural
    # ~10m / urban up to ~5cm, CC BY 4.0). NZ-only coverage, z0-z21.
    # Same key handling as nz_topo50 (see there); on_error covers
    # both out-of-coverage 404s and unset/invalid API key (400/403)
    # with transparent fallback to Esri World Imagery.
    # Upstream .webp (unlike nz_topo50's lossless png): imagery
    # tolerates the double lossy generation (LINZ webp encode ->
    # decode -> our webp cache encode) and webp cuts fetch bytes on
    # cache misses ~40%; the merge canvas (request_format png)
    # converts regardless, and Pillow in this image decodes webp.
    url: https://basemaps.linz.govt.nz/v1/tiles/aerial/3857/%(z)s/%(x)s/%(y)s.webp?api=${MAP_LINZ_API_KEY}
    grid: webmercator
    transparent: true
    min_res: 1223
    on_error:
      400:
        response: transparent
        cache: true
      403:
        response: transparent
        cache: true
      404:
        response: transparent
        cache: true
    coverage:
      datasource: /mapproxy/config/nz-boundary.geojson
      srs: 'EPSG:4326'
      clip: true
caches:
  # v2 suffix = cache rename: MapProxy keys tiles by cache name, so
  # the renamed directory starts fresh and pre-swap (geolandbasemap)
  # tiles on the PVC are abandoned instead of served stale.
  world_topo_cache_v3:
    grids: [webmercator]
    # cache-level merge: multiple sources are merged left (bottom) to
    # right (top) before they are cached - OpenTopoMap everywhere,
    # BEV Austrian Map on top inside Austria, swisstopo on top inside
    # the Switzerland polygon, Plan IGN on top inside France, LINZ
    # topo-raster on top inside New Zealand (v3 rename: added NZ).
    # Merge internally with alpha (request_format png), store + serve
    # WebP: smaller than JPEG at equal quality (Pillow webp quality
    # defaults apply; jpeg_quality has no effect on webp).
    format: image/webp
    request_format: image/png
    image:
      transparent: false
    sources: [opentopo, at_bev_karte, ch_pixelkarte, ign_plan, nz_topo50]
    # Re-fetch tiles older than four weeks while serving.
    refresh_before:
      weeks: 4
  world_satellite_cache_v2:
    grids: [webmercator]
    # Satellite: Esri World Imagery everywhere; swissimage (CH+LI),
    # basemap.at ortho 30cm (AT), IGN BD ORTHO (FR) and LINZ aerial
    # (NZ) merged on top from z7 (v2 rename: added NZ).
    format: image/webp
    request_format: image/png
    image:
      transparent: false
    sources: [esri_world, at_ortho, ch_swissimage, fr_ortho, nz_aerial]
    refresh_before:
      weeks: 4
layers:
  - name: world_topo
    title: World Topo (OpenTopoMap; BEV + swisstopo from z7; IGN FR + LINZ NZ from z6)
    sources: [world_topo_cache_v3]
  - name: world_satellite
    title: World Satellite (Esri; swissimage CH + IGN ortho FR + LINZ aerial NZ from z7)
    sources: [world_satellite_cache_v2]
globals:
  cache:
    # lock files must live in the writable cache_data volume (the
    # ConfigMap at /mapproxy/config is read-only)
    lock_dir: /mapproxy/config/cache_data/lock
  image:
    resampling_method: bilinear
    jpeg_quality: 85
  http:
    client_timeout: 30
    headers:
      # Polite scraping: identify ourselves to the upstream tile servers
      User-Agent: 'Wodore-Tiles/1.0 (https://wodore.com; tb@wodore.com)'
