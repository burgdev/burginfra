# Pinned low: a cache pod needs no node-wide core count, and a miss
# storm must not starve co-located pods.
worker_processes 2;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

# NOTE: nginx vars are all lowercase; Flux postBuild substitutes are
# all uppercase (NAMESPACE, ENVIRONMENT, WODORE_HOST, ...), so
# envsubst can never touch nginx variables. Keep that invariant when
# adding substitute vars.
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Cache verdict in the access log so hit rate is greppable
    log_format main '$remote_addr [$time_local] "$request" $status '
                    'cache=$upstream_cache_status rt=$request_time '
                    'urt=$upstream_response_time';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;

    # Writable temp paths for the unprivileged runtime (root fs is RO)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Disk-backed tile cache on the wd-martin-cache PVC. Martin's own
    # Cache-Control headers take precedence over proxy_cache_valid;
    # the 1h fallback only applies to responses without expiry headers.
    proxy_cache_path /var/cache/nginx/tiles
        levels=1:2
        keys_zone=tiles:64m
        # 12g of the 15Gi PVC: ~3Gi headroom for fs overhead and the
        # cache manager's ~1-minute eviction interval.
        max_size=12g
        inactive=365d
        use_temp_path=off;

    server {
        listen 8080;
        server_name _;

        # Runtime resolution via kube-dns instead of startup resolution:
        # the cache pod boots even while martin is unreachable. nginx
        # resolves the resolver hostname once at config load via the
        # pod's own DNS. On a cluster with a non-default service CIDR
        # this can be swapped for the kube-dns ClusterIP (k3s default:
        # 10.43.0.10).
        resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;
        # FQDN, not the short service name: nginx's resolver queries DNS
        # directly and does NOT apply the pod's search domains, so the
        # bare "wd-martin" NXDOMAINs at request time (502 on every
        # proxied path). ${NAMESPACE} is a deliberate Flux postBuild
        # substitution - the only braced variable allowed in this file.
    set $martin_svc "wd-martin.${NAMESPACE}.svc.cluster.local";
    set $martin_upstream "$martin_svc:3000";

        # Real cache verdict for clients. Traefik must NOT set
        # X-Cache-Status via customResponseHeaders (it overwrites
        # unconditionally and would clobber this).
        add_header X-Cache-Status $upstream_cache_status always;

        # CORS is deliberately NOT set at this level: add_header /
        # proxy_hide_header inheritance is all-or-nothing per level - a
        # location with ANY own directive of either family (e.g.
        # /raster/'s Cache-Control add_header) inherits NOTHING from
        # here. Each tile-serving location therefore repeats the trio
        #   proxy_hide_header Access-Control-Allow-Origin;
        #   proxy_hide_header Access-Control-Allow-Credentials;
        #   add_header Access-Control-Allow-Origin "*" always;
        # Martin can only ECHO the request's Origin (actix-cors
        # allow_any_origin; `cors.origin: ["*"]` in martin.yaml emits
        # no literal wildcard), and an origin-dependent ACAO poisons
        # every URL-keyed single-variant cache around this tier: this
        # proxy_cache ignores Vary, and BunnyCDN (tiles.cdn.*) collapses
        # it - the first origin to prime a tile URL gets its origin
        # baked into the cached object and every other origin then
        # fails CORS in the browser. The literal wildcard is safe:
        # tiles are public, unauthenticated, never credentialed (same
        # policy as imagor and the API's ApiCdnCacheMiddleware,
        # wodore-backend #426).

        # Liveness/readiness target for the cache pod itself. Never
        # depends on martin: if this endpoint proxied to martin, a
        # martin restart would unready the cache pod, Traefik would
        # drop it from the endpoints, and serve-stale would be moot.
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location = /health {
            proxy_pass http://$martin_upstream;
            proxy_cache off;
        }

        # Stable raster facade: /raster/* -> the mapproxy backend
        # (served under its internal /mapproxy/ prefix). Swap the
        # upstream here to replace the implementation without changing
        # any client URL.
        set $raster_svc "wd-mapproxy.${NAMESPACE}.svc.cluster.local";
        set $raster_upstream "$raster_svc:80";
        location /raster/ {
            # Variables in proxy_pass skip nginx's automatic URI mapping
            # (the trailing path is not applied) - rewrite explicitly.
            rewrite ^/raster/(.*)$ /mapproxy/$1 break;
            proxy_pass http://$raster_upstream;

            # Browser caching (MapProxy has no expires option in this
            # build): tiles are stable between 4-week refreshes, so a
            # day of browser cache is safe and cuts repeat traffic.
            expires 7d;
            add_header Cache-Control "public, immutable";
            # CORS trio (see the server-level comment): mapproxy sends
            # no CORS headers today, the hides are belt if that changes.
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            add_header Access-Control-Allow-Origin "*" always;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            proxy_set_header Accept-Encoding "";

            proxy_cache tiles;
            proxy_cache_methods GET HEAD;
            proxy_cache_key "$scheme$proxy_host$uri$is_args$args";
            # Raster tiles are stable for mapproxy's 4-week refresh
            # window - cache responses for a week. The cache key
            # INCLUDES the query string, which is the busting
            # mechanism: the frontend appends a version param to the
            # raster tile URLs (?v=N) and bumps N whenever a tile
            # source changes - new key = MISS = fresh fetch, for every
            # client simultaneously (this tier AND the browsers'
            # immutable 7d caches; mapproxy ignores the param and keeps
            # serving from its PVC, so unchanged tiles do not refetch
            # upstream). Config deploys do NOT purge this tier (the
            # PVC outlives the pods) - without a version bump, stale
            # tiles serve until the 7d TTL expires. Emergency manual
            # purge: kubectl exec into this pod and wipe
            # /var/cache/nginx/tiles, then `nginx -s reload`.
            proxy_cache_valid 200 204 7d;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_lock_age 30s;
            proxy_cache_use_stale error timeout updating
                http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;

            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 60s;
            proxy_buffering on;
        }

        # Explicit MLT (MapLibre Tile) v1 URLs - mirror of the backend
        # tile-router route (wodore-backend tile_server/
        # tile-router.conf.template, the single source of truth).
        # Any Martin source is additionally available as MLT by
        # appending .mlt to the canonical tile path: the suffix is
        # stripped here and Martin converts at serve time via the
        # Accept header (implicit on martin >= 1.16; the backend's
        # martin.yaml keeps convert_to_mlt as a pre-1.16 belt). Only
        # the literal .mlt suffix selects MLT: extension-less and
        # .pbf/.mvt stay MVT - Martin 301s extensions to the canonical
        # path. Safe to roll standalone: nothing requests .mlt until
        # served styles opt in (map_seed, huts overlay first).
        location ~ ^/(?<mlt_src>[A-Za-z0-9_,]+)/(?<mlt_z>\d+)/(?<mlt_x>\d+)/(?<mlt_y>\d+)\.mlt$ {
            # $martin_upstream is set server-wide (above). No
            # rewrite, unlike the dev tile-router template:
            # proxy_cache_key is evaluated AFTER the rewrite phase, so
            # a rewrite to the extension-less path would make $uri
            # identical to the general location's - aliasing the MLT
            # and MVT variants of a tile into ONE cache entry (MLT
            # bytes served to MVT clients; the dev router has no
            # cache, so the template is immune and stays as-is).
            # Instead the upstream URI is built from the regex
            # captures (variables in proxy_pass skip the automatic
            # URI mapping - same gotcha as /raster/), leaving $uri at
            # ...mlt so the UNCHANGED cache key below separates the
            # variants by construction. $is_args$args is explicit:
            # with variables in proxy_pass the original query string
            # is NOT appended automatically (availability date/days
            # params, frontend ?v=N busts).
            proxy_pass http://$martin_upstream/$mlt_src/$mlt_z/$mlt_x/$mlt_y$is_args$args;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # X-Forwarded-*: same rules as the general location below
            # (never append the forged client-supplied chain; pass the
            # ORIGINAL proto so martin emits https:// tile templates).
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            # Ask Martin to convert. Pin Accept-Encoding to identity:
            # MLT embeds lightweight compression (FastPFOR/FSST), and
            # gzip on top would negate the decode-speed win (the
            # general location strips Accept-Encoding for the same
            # cache-purity reason).
            proxy_set_header Accept application/vnd.maplibre-tile;
            proxy_set_header Accept-Encoding identity;

            # CORS trio (see the server-level comment): hide Martin's
            # echoed ACAO, stamp the origin-independent wildcard. The
            # ACAO add_header cancels inheritance, so X-Cache-Status
            # repeats here to keep reaching clients.
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            add_header Access-Control-Allow-Origin "*" always;
            add_header X-Cache-Status $upstream_cache_status always;

            proxy_cache tiles;
            proxy_cache_methods GET HEAD;
            # Same URL key as every other location - deliberately NOT
            # a per-location variant: $uri was never rewritten, so it
            # still carries the .mlt suffix and the MLT/MVT variants
            # of a tile are distinct entries by construction. No
            # Accept-in-key, no Vary (proxy_cache ignores Vary
            # anyway).
            proxy_cache_key "$scheme$proxy_host$uri$is_args$args";
            # Fallback only; upstream Cache-Control wins. 204: martin
            # returns empty tiles as 204. No 301: stale redirects are
            # never worth an hour.
            proxy_cache_valid 200 204 1h;

            # Collapse identical concurrent requests into one upstream
            # fetch (map-load bursts request the same tiles at once).
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_lock_age 30s;

            # Serve stale while refreshing or when martin/Postgres is
            # unavailable - tile restarts and DB blips stay invisible.
            proxy_cache_use_stale error timeout updating
                http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;

            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 60s;
            proxy_buffering on;
        }

        location / {
            proxy_pass http://$martin_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # $remote_addr (the Traefik pod IP) - never append the
            # client-supplied chain, which is trivially forged.
            proxy_set_header X-Forwarded-For $remote_addr;
            # Pass the ORIGINAL proto through: TLS terminates at the
            # ingress, so $scheme is always http here - with $scheme,
            # martin emits http:// tile templates in TileJSON/styles and
            # browsers block them as mixed content on the https map
            # (no huts/places rendered at all). ingress-nginx always sets
            # X-Forwarded-Proto for TLS requests; cluster-internal callers
            # without the header keep plain-http behaviour.
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            # Cache stores identity-encoded bodies; compression happens
            # per client at the Traefik edge (wd-martin-compress).
            proxy_set_header Accept-Encoding "";

            # CORS trio (see the server-level comment): hide Martin's
            # echoed ACAO, stamp the origin-independent wildcard. The
            # ACAO add_header cancels inheritance, so X-Cache-Status
            # repeats here to keep reaching clients.
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            add_header Access-Control-Allow-Origin "*" always;
            add_header X-Cache-Status $upstream_cache_status always;

            proxy_cache tiles;
            proxy_cache_methods GET HEAD;
            # Full URI including query args: martin function sources
            # take parameters via the query string, so distinct param
            # sets must stay distinct cache entries - a path-only key
            # would serve wrong tiles. Junk-query churn is bounded by
            # the 12g LRU cap and throttled at Traefik instead.
            proxy_cache_key "$scheme$proxy_host$uri$is_args$args";
            # Fallback only; upstream Cache-Control wins. 204: martin
            # returns empty tiles as 204. No 301: stale redirects are
            # never worth an hour.
            proxy_cache_valid 200 204 1h;

            # Collapse identical concurrent requests into one upstream
            # fetch (map-load bursts request the same tiles at once).
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_lock_age 30s;

            # Serve stale while refreshing or when martin/Postgres is
            # unavailable - tile restarts and DB blips stay invisible.
            proxy_cache_use_stale error timeout updating
                http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;

            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 60s;
            proxy_buffering on;
        }
    }
}
