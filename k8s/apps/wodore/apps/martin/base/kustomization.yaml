apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ${NAMESPACE}
commonLabels:
  app.kubernetes.io/name: wd-martin
  app.kubernetes.io/component: tile-server
  app.kubernetes.io/environment: ${ENVIRONMENT}
  app.kubernetes.io/part-of: apps
  app.kubernetes.io/managed-by: flux
resources:
  - ingress.yaml
  - pvcs.yaml
  - deployment.yaml
  - service.yaml
  - nginx-cache-pvc.yaml
  - nginx-cache-deployment.yaml
  - nginx-cache-service.yaml
# Hash-suffixed name (default): every nginx.conf change produces a new
# ConfigMap name, kustomize rewrites the Deployment volume reference,
# and the pod rolls automatically. Plain ConfigMap resources do NOT
# restart pods - nginx would keep serving the old config forever.
configMapGenerator:
  - name: wd-martin-cache-nginx-config
    files:
      - nginx.conf=nginx-cache-config.conf
