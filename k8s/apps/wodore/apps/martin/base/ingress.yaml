apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wd-martin
  annotations:
    cert-manager.io/cluster-issuer: ${CERT_ISSUER_PROD}
    # yamllint disable rule:line-length
    traefik.ingress.kubernetes.io/router.middlewares: ${NAMESPACE}-wd-martin-header@kubernetescrd,${NAMESPACE}-wd-martin-compress@kubernetescrd
    # yamllint enable rule:line-length
spec:
  rules:
    - host: tiles.${ENV_SUBDOMAIN}${WODORE_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wd-martin-cache
                port:
                  number: 80
  tls:
    - secretName: wd-martin-${ENVIRONMENT}-tls
      hosts:
        - tiles.${ENV_SUBDOMAIN}${WODORE_HOST}
---
# Client-facing TTL only - nginx caches tiles for longer at origin.
# X-Cache-Status is set by the nginx cache tier (HIT/MISS/STALE);
# customResponseHeaders here would overwrite it unconditionally.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: wd-martin-header
spec:
  headers:
    customResponseHeaders:
      Cache-Control: "public, max-age=1800"
    accessControlAllowMethods:
      - GET
      - OPTIONS
    accessControlAllowOriginList:
      - https://stg.${WODORE_HOST}
      - https://${WODORE_HOST}
      - https://stg.${WODO_HOST}
      - https://${WODO_HOST}
    accessControlMaxAge: 100
---
# Tile response compression at the Traefik edge. The nginx cache stores
# identity-encoded bodies (Accept-Encoding is stripped before martin),
# so each client negotiates its own encoding without fragmenting the
# cache.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: wd-martin-compress
spec:
  compress: {}
