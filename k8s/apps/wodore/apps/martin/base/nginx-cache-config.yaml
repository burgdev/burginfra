apiVersion: v1
kind: ConfigMap
metadata:
  name: wd-martin-cache-nginx-config
data:
  nginx.conf: |
    # Pinned low: a cache pod needs no node-wide core count, and a miss
    # storm must not starve co-located pods.
    worker_processes 2;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
    }

    # NOTE: nginx vars are all lowercase; Flux postBuild substitutes are
    # all uppercase (NAMESPACE, ENVIRONMENT, WODORE_HOST, ...), so
    # envsubst can never touch nginx variables. Keep that invariant when
    # adding substitute vars.
    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        server_tokens off;

        # Cache verdict in the access log so hit rate is greppable
        log_format main '$remote_addr [$time_local] "$request" $status '
                        'cache=$upstream_cache_status rt=$request_time '
                        'urt=$upstream_response_time';
        access_log /dev/stdout main;

        sendfile on;
        tcp_nopush on;

        # Writable temp paths for the unprivileged runtime (root fs is RO)
        client_body_temp_path /tmp/client_temp;
        proxy_temp_path /tmp/proxy_temp;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;

        # Disk-backed tile cache on the wd-martin-cache PVC. Martin's own
        # Cache-Control headers take precedence over proxy_cache_valid;
        # the 1h fallback only applies to responses without expiry headers.
        proxy_cache_path /var/cache/nginx/tiles
            levels=1:2
            keys_zone=tiles:64m
            # 12g of the 15Gi PVC: ~3Gi headroom for fs overhead and the
            # cache manager's ~1-minute eviction interval.
            max_size=12g
            inactive=14d
            use_temp_path=off;

        server {
            listen 8080;
            server_name _;

            # Runtime resolution via kube-dns instead of startup resolution:
            # the cache pod boots even while martin is unreachable. nginx
            # resolves the resolver hostname once at config load via the
            # pod's own DNS. On a cluster with a non-default service CIDR
            # this can be swapped for the kube-dns ClusterIP (k3s default:
            # 10.43.0.10).
            resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;
            # FQDN, not the short service name: nginx's resolver queries DNS
            # directly and does NOT apply the pod's search domains, so the
            # bare "wd-martin" NXDOMAINs at request time (502 on every
            # proxied path). ${NAMESPACE} is a deliberate Flux postBuild
            # substitution - the only braced variable allowed in this file.
        set $martin_svc "wd-martin.${NAMESPACE}.svc.cluster.local";
        set $martin_upstream "$martin_svc:3000";

            # Real cache verdict for clients. Traefik must NOT set
            # X-Cache-Status via customResponseHeaders (it overwrites
            # unconditionally and would clobber this).
            add_header X-Cache-Status $upstream_cache_status always;

            # Liveness/readiness target for the cache pod itself. Never
            # depends on martin: if this endpoint proxied to martin, a
            # martin restart would unready the cache pod, Traefik would
            # drop it from the endpoints, and serve-stale would be moot.
            location = /nginx-health {
                access_log off;
                return 200 "ok\n";
            }

            location = /health {
                proxy_pass http://$martin_upstream;
                proxy_cache off;
            }

            location / {
                proxy_pass http://$martin_upstream;
                proxy_http_version 1.1;

                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                # $remote_addr (the Traefik pod IP) - never append the
                # client-supplied chain, which is trivially forged.
                proxy_set_header X-Forwarded-For $remote_addr;
                proxy_set_header X-Forwarded-Proto $scheme;
                # Cache stores identity-encoded bodies; compression happens
                # per client at the Traefik edge (wd-martin-compress).
                proxy_set_header Accept-Encoding "";

                proxy_cache tiles;
                proxy_cache_methods GET HEAD;
                # Full URI including query args: martin function sources
                # take parameters via the query string, so distinct param
                # sets must stay distinct cache entries - a path-only key
                # would serve wrong tiles. Junk-query churn is bounded by
                # the 12g LRU cap and throttled at Traefik instead.
                proxy_cache_key "$scheme$proxy_host$uri$is_args$args";
                # Fallback only; upstream Cache-Control wins. 204: martin
                # returns empty tiles as 204. No 301: stale redirects are
                # never worth an hour.
                proxy_cache_valid 200 204 1h;

                # Collapse identical concurrent requests into one upstream
                # fetch (map-load bursts request the same tiles at once).
                proxy_cache_lock on;
                proxy_cache_lock_timeout 5s;
                proxy_cache_lock_age 30s;

                # Serve stale while refreshing or when martin/Postgres is
                # unavailable - tile restarts and DB blips stay invisible.
                proxy_cache_use_stale error timeout updating
                    http_500 http_502 http_503 http_504;
                proxy_cache_background_update on;

                proxy_connect_timeout 5s;
                proxy_send_timeout 10s;
                proxy_read_timeout 60s;
                proxy_buffering on;
            }
        }
    }
