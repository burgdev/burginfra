apiVersion: apps/v1
kind: Deployment
metadata:
  name: wd-martin
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 60
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: wd-martin
  template:
    metadata:
      labels:
        app: wd-martin
    spec:
      # Shared PID namespace: the sync-watcher sidecar can restart the
      # martin container in place when a sync touches /martin_sync -
      # no kubectl, no RBAC, no backend coupling (pod IP is unchanged,
      # so the cache tier keeps serving).
      shareProcessNamespace: true
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: "OnRootMismatch"
      containers:
        - name: wd-martin
          image: ghcr.io/maplibre/martin:1.16.1
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsUser: 1001
            runAsGroup: 1001
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: wd-backend-postgres-app
                  key: uri
            - name: MARTIN_SYNC_MOUNT
              value: "/martin_sync"
          command:
            - /bin/sh
            - -c
            - |
              martin --config /martin_sync/config/martin.yaml \
                --webui enable-for-all
          volumeMounts:
            - name: martin-sync
              mountPath: /martin_sync
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 15
          resources:
            limits:
              memory: 2Gi
            requests:
              memory: 512Mi
        - name: sync-watcher
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              # martin reads /martin_sync only at startup. Watch the WHOLE
              # tree (config, styles, sprites, fonts); when a sync touches
              # any file, kill the martin process - the container restarts
              # in place and re-reads everything. Pure busybox polling:
              # no inotify, no kubectl, no RBAC.
              MARKER=/watch/.sync_marker
              touch "$MARKER"
              while true; do
                sleep 30
                CHANGED=$(find /martin_sync -type f -newer "$MARKER" \
                  2>/dev/null | head -1)
                [ -z "$CHANGED" ] && continue
                touch "$MARKER"
                echo "sync change detected ($CHANGED) - restarting martin"
                sleep 15   # let the sync finish writing
                pkill -f "martin --config" || true
                break      # our container is restarted by kubelet
              done
          volumeMounts:
            - name: martin-sync
              mountPath: /martin_sync
              readOnly: true
            - name: watcher-marker
              mountPath: /watch
          resources:
            limits:
              memory: 32Mi
            requests:
              cpu: 5m
              memory: 8Mi
      volumes:
        - name: martin-sync
          persistentVolumeClaim:
            claimName: wd-martin-sync-v1
        - name: watcher-marker
          emptyDir: {}
