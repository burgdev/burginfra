# you need to apply any changes made here!
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  namespace: flux-system
data:
  # TODO: you need to MANUALLY apply any changes made here!
  #k-localhost; kubectl apply -f k8s/clusters/flux-system/overlays/local/cluster_settings.yaml

  # === CLUSTER SETTINGS ===
  CLUSTER: "local"
  KUBE_VERSION: "1.33.5" # Server version: v1.33.5+k3s1
  KUBE_TOOLS_VERSION: "1.33.5" # alpine/k8s image tag version

  # === DOMAIN & EMAIL ===
  CRUXLI_HOST: "crux.local.gd"
  CRUXLI_EMAIL: "tobias@burgdev.ch"
  BURGDEV_HOST: "burgdev.local.gd"
  BURGDEV_EMAIL: "tobias@burgdev.ch"
  WODORE_HOST: "wodore.local.gd"
  WODORE_EMAIL: "tb@wodore.com"
  WODO_HOST: "wodo.re.local.gd"
  WODO_EMAIL: "tb@wodo.re"
  BURGINFRA_HOST: "infra.local.gd"

  # === CERTIFICATES ===
  CERT_ISSUER_STAGING: "local-ca-issuer"
  CERT_ISSUER_PROD: "local-ca-issuer"

  # === FLUX ===
  IMAGE_AUTOMATION_SUSPEND: "true" # do not run image automation on local cluster

  # === IMMICH (Photo Management) ===
  IMMICH_FLUX_SUSPEND: "false"
  IMMICH_SERVER_REPLICAS: "0" # Stopped by default on local to save memory
  IMMICH_ML_REPLICAS: "0" # Stopped by default on local to save memory
  IMMICH_POSTGRES_HIBERNATE: "on" # TODO: Not working - YAML boolean parsing issue with "on"/"off" values
  IMMICH_LIBRARY_STORAGE_SIZE: "5Gi"
  IMMICH_EXTERNAL_STORAGE_SIZE: "5Gi"
  IMMICH_DB_STORAGE_SIZE: "2Gi"

  # === UMAMI (Analytics) ===
  UMAMI_FLUX_SUSPEND: "false"
  UMAMI_REPLICAS: "0" # Stopped by default on local to save memory
  UMAMI_POSTGRES_HIBERNATE: "on" # TODO: Not working - YAML boolean parsing issue with "on"/"off" values

  # === WODORE (Application) ===
  WODORE_FLUX_SUSPEND: "false"
  WODORE_REPLICAS: "1" # Keep running for development
  WODORE_POSTGRES_HIBERNATE: "off" # TODO: Not working - YAML boolean parsing issue with "on"/"off" values
  WD_CRON_AVAILABILITY_SUSPEND: "true" # do not run cron job on local cluster
  WD_IMAGOR_STORAGE_SIZE: "2Gi"
  WD_BACKEND_MEDIA_STORAGE_SIZE: "5Gi"
  WD_BACKEND_PY_CACHE_STORAGE_SIZE: "1Gi"
  WD_BACKEND_DB_STORAGE_SIZE: "2Gi"

  # === VALHALLA (Routing Engine) ===
  VALHALLA_FLUX_SUSPEND: "false" # Enabled on local for development
  VALHALLA_REPLICAS: "1"
  VALHALLA_STORAGE_SIZE: "10Gi"
  VALHALLA_OSM_URLS: "https://download.geofabrik.de/europe/switzerland-latest.osm.pbf"
  VALHALLA_GTFS_URLS: "https://data.opentransportdata.swiss/en/dataset/timetable-2026-gtfs2020/resource_permalink/gtfs_fp2026_20260103.zip"
  VALHALLA_ELEVATION_BOUNDS: "45,46,47,48:5,6,7,8,9,10,11" # lat_range:lon_range for Switzerland

