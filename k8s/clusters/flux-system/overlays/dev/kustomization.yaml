apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - source_dev.yaml
patches:
  - path: flux-kustom.patch.yaml
    target:
      kind: Kustomization
      name: flux-sync-base
    options:
      allowNameChange: true
  - path: source.patch.yaml
    target:
      kind: GitRepository
      name: git-burginfra
