# you need to apply any changes made here!
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  namespace: flux-system
data:
  # TODO: you need to MANUALLY apply any changes made here!
  #k-infra-vps1; kubectl apply -f k8s/clusters/flux-system/overlays/burginfra/cluster_settings.yaml

  # === CLUSTER SETTINGS ===
  CLUSTER: "burginfra"
  KUBE_VERSION: "1.33.6" # Server version: v1.33.6+k3s1
  KUBE_TOOLS_VERSION: "1.33.7" # alpine/k8s image tag version (1.33.6 doesn't exist)

  # === DOMAIN & EMAIL ===
  CRUXLI_HOST: "crux.li"
  CRUXLI_EMAIL: "tobias@burgdev.ch"
  BURGDEV_HOST: "burgdev.ch"
  BURGDEV_EMAIL: "tobias@burgdev.ch"
  BURGINFRA_HOST: "infra.burgdev.ch"
  WODORE_HOST: "wodore.com"
  WODORE_EMAIL: "info@wodore.com"
  WODO_HOST: "wodo.re"
  WODO_EMAIL: "info@wodo.re"

  # === CERTIFICATES ===
  CERT_ISSUER_STAGING: "letsencrypt-staging"
  CERT_ISSUER_PROD: "letsencrypt-prod"

  # === FLUX ===
  IMAGE_AUTOMATION_SUSPEND: "false" # enable image automation on burginfra cluster

  # === IMMICH (Photo Management) ===
  IMMICH_FLUX_SUSPEND: "false"
  IMMICH_SERVER_REPLICAS: "1"
  IMMICH_ML_REPLICAS: "1"
  IMMICH_POSTGRES_HIBERNATE: "off" # TODO: Not working - YAML boolean parsing issue with "on"/"off" values
  IMMICH_LIBRARY_STORAGE_SIZE: "200Gi"
  IMMICH_EXTERNAL_STORAGE_SIZE: "100Gi"
  IMMICH_DB_STORAGE_SIZE: "10Gi"

  # === UMAMI (Analytics) ===
  UMAMI_FLUX_SUSPEND: "false"
  UMAMI_REPLICAS: "1"
  UMAMI_POSTGRES_HIBERNATE: "off" # TODO: Not working - YAML boolean parsing issue with "on"/"off" values

  # === WODORE (Application) ===
  WODORE_FLUX_SUSPEND: "false"
  WODORE_REPLICAS: "1"
  WODORE_POSTGRES_HIBERNATE: "off" # TODO: Not working - YAML boolean parsing issue with "on"/"off" values
  WD_CRON_AVAILABILITY_SUSPEND: "false"
  WD_IMAGOR_STORAGE_SIZE: "30Gi"
  WD_BACKEND_MEDIA_STORAGE_SIZE: "40Gi"
  WD_BACKEND_PY_CACHE_STORAGE_SIZE: "5Gi"
  WD_BACKEND_DB_STORAGE_SIZE: "10Gi"

  # === VALHALLA (Routing Engine) ===
  VALHALLA_FLUX_SUSPEND: "true" # Disabled on burginfra during development
  VALHALLA_REPLICAS: "0" # Set to 0 when suspended
  VALHALLA_STORAGE_SIZE: "30Gi"
  VALHALLA_INIT_JOB: "check" # Init job mode: download|auto|check|bypass (bypass = use data copied from local)
  VALHALLA_OSM_URLS: "https://download.geofabrik.de/europe/switzerland-latest.osm.pbf"
  VALHALLA_GTFS_URLS: "https://data.opentransportdata.swiss/en/dataset/timetable-2026-gtfs2020/resource_permalink/gtfs_fp2026_20260103.zip"
  VALHALLA_ELEVATION_BOUNDS: "45,46,47,48:5,6,7,8,9,10,11" # lat_range:lon_range for Switzerland

