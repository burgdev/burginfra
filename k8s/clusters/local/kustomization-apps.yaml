apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-whoami
  namespace: flux-system
spec:
  interval: 10s
  path: "../../apps/whoami" 
  prune: true
  sourceRef:
    kind: GitRepository
    name: local-gitops
  postBuild:
    substitute:
      DOMAIN: "whoami.burginfra"
