apiVersion: v1
data:
  password: aW1taWNo
  username: aW1taWNo
kind: Secret
metadata:
  name: prod-immich-secrets
  namespace: immich
type: kubernetes.io/basic-auth
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: immich-cache
  name: prod-immich-cache
  namespace: immich
spec:
  ports:
  - name: tcp-redis
    port: 6379
    protocol: TCP
    targetPort: 6379
  selector:
    app: immich-cache
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: immich-database
  name: prod-immich-database
  namespace: immich
spec:
  ports:
  - name: tcp-postgresql
    port: 5432
    targetPort: 5432
  selector:
    app: immich-database
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: prod-immich-cache-pv
spec:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 10Gi
  hostPath:
    path: /mnt/kubernetes/volumes/immich/cache
    type: DirectoryOrCreate
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: prod-immich-database-pv
spec:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 15Gi
  hostPath:
    path: /mnt/kubernetes/volumes/immich/database
    type: DirectoryOrCreate
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: prod-immich-library-pv
spec:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 400Gi
  hostPath:
    path: /mnt/kubernetes/volumes/immich/server/library
    type: DirectoryOrCreate
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prod-immich-cache
  namespace: immich
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
  volumeName: prod-immich-cache-pv
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prod-immich-database
  namespace: immich
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 15Gi
  storageClassName: local-path
  volumeName: prod-immich-database-pv
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prod-immich-library
  namespace: immich
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 400Gi
  storageClassName: local-path
  volumeName: prod-immich-library-pv
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prod-immich-cache
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-cache
  template:
    metadata:
      labels:
        app: immich-cache
    spec:
      containers:
      - args:
        - --save
        - 60 1
        - --loglevel
        - warning
        - --appendonly
        - "yes"
        command:
        - valkey-server
        image: docker.io/valkey/valkey:9.0-alpine3.22
        imagePullPolicy: IfNotPresent
        name: immich-valkey
        ports:
        - containerPort: 6379
        resources: {}
        volumeMounts:
        - mountPath: /data
          name: valkeydata
      volumes:
      - name: valkeydata
        persistentVolumeClaim:
          claimName: prod-immich-cache
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prod-immich-database
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-database
  template:
    metadata:
      labels:
        app: immich-database
    spec:
      containers:
      - env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: prod-immich-secrets
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: prod-immich-secrets
        - name: POSTGRES_DB
          value: immich
        image: docker.io/tensorchord/vchord-postgres:pg17-v0.4.3
        imagePullPolicy: Always
        name: immich-postgres
        ports:
        - containerPort: 5432
        resources: {}
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: pgdata
      volumes:
      - name: pgdata
        persistentVolumeClaim:
          claimName: prod-immich-database
---
