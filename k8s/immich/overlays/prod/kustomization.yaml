# k8s/immich/overlays/local/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

## Patch the values for local environment
namespace: immich
namePrefix: prod-

# Add your patch
patches:
- path: immich-pv.patch.yaml
  target:
    kind: PersistentVolume
    name: immich-library-pv
- path: immich-ing.patch.yaml
  target:
    kind: Ingress
    name: immich
- path: immich-cache-pv.patch.yaml
  target:
    kind: PersistentVolume
    name: immich-cache-pv
- path: immich-cache-pvc.patch.yaml
  target:
    kind: PersistentVolumeClaim
    name: immich-cache
- path: immich-db-pv.patch.yaml
  target:
    kind: PersistentVolume
    name: immich-database-pv
- path: immich-db-pvc.patch.yaml
  target:
    kind: PersistentVolumeClaim
    name: immich-database

#labels:
#- includeSelectors: true
#  pairs:
#    app.kubernetes.io/instance:local-immich
#    app.kubernetes.io/name:server

  
# Create secrets from .env.secret (sensitive data)

configMapGenerator:
- name: immich-config
  envs:
    - .env  # Environment variables
  options:
    disableNameSuffixHash: true

- name: immich-values
  files:
    - .immich-values.yaml
  options:
    disableNameSuffixHash: true

# Add replacements for both HelmChart values and Ingress
replacements:
# For HelmChart values
- source:
    kind: ConfigMap
    name: immich-values
    fieldPath: data.\.immich-values\.yaml
  targets:
  - select:
      kind: HelmChart
      name: immich
    fieldPaths:
    - spec.valuesContent
    options:
      create: true

# For Ingress host
- source:
    kind: ConfigMap
    name: immich-config
    fieldPath: data.DOMAIN
  targets:
  - select:
      kind: Ingress
      name: immich
    fieldPaths:
    - spec.rules.0.host
    - spec.tls.0.hosts.0

secretGenerator:
- name: immich-secrets
  type: kubernetes.io/basic-auth
  envs:
    - .env.secret
  options:
    disableNameSuffixHash: true

