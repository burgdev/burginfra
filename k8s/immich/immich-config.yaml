image:
  colorspace: p3
  extractEmbedded: false
  fullsize:
    enabled: false
    format: webp
    quality: 80
  preview:
    format: webp
    quality: 65
    size: 1440
  thumbnail:
    format: webp
    quality: 50
    size: 250

logging:
  enabled: true
  level: ${IMMICH_LOG_LEVEL:-log}

server:
  externalDomain: 
  loginPageMessage: <div>$WELCOME_TEXT_HTML</div>
  publicUsers: true

map:
  enabled: true
  darkStyle: https://api.maptiler.com/maps/ch-swisstopo-lbm/style.json?key=$MAPTILER_KEY
  lightStyle: https://api.maptiler.com/maps/ch-swisstopo-lbm/style.json?key=$MAPTILER_KEY

notifications:
  smtp:
    enabled: $EMAIL_ENABLED
    from: $EMAIL_FROM
    replyTo: ""
    transport:
      host: $EMAIL_HOST
      ignoreCert: false
      password: $EMAIL_HOST_PASSWORD
      port: $EMAIL_HOST_PORT
      username: ${EMAIL_HOST_USER:-}
