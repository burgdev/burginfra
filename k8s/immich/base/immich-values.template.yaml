# Fri Oct 10 11:57:22 AM CEST 2025 -- DO NOT EDIT: Auto-generated from immich-values.template.yaml

image:
  tag: v2.0.1

env:
  IMMICH_MEDIA_LOCATION: /usr/src/app/upload
  DB_HOSTNAME: $ENV-immich-database.immich.svc.cluster.local
  DB_USERNAME:
    valueFrom:
      secretKeyRef:
        name: $ENV-immich-secrets
        key: username
  DB_PASSWORD:
    valueFrom:
      secretKeyRef:
        name: $ENV-immich-secrets
        key: password
  REDIS_HOSTNAME: $ENV-immich-cache.immich.svc.cluster.local
  REDIS_PORT: 6379
  REDIS_DBINDEX: 0
  
redis:
  enabled: false

immich:
  persistence:
    library:
      existingClaim: $ENV-immich-library
  configuration:
    image:
      colorspace: p3
      extractEmbedded: false
      fullsize:
        enabled: false
        format: webp
        quality: 80
      preview:
        format: webp
        quality: 65
        size: 1440
      thumbnail:
        format: webp
        quality: 50
        size: 250

    logging:
      enabled: true
      level: log

    machineLearning:
      enabled: true
      clip:
        enabled: true
        modelName: "ViT-L-16-SigLIP2-256__webli"
      duplicateDetection:
        enabled: true
        maxDistance: 0.01
      facialRecognition:
        enabled: true
        maxDistance: 0.5
        minFaces: 5
        minScore: 0.7
        modelName: "buffalo_l"

    server:
      externalDomain: $EXTERNAL_DOMAIN 
      loginPageMessage: <div>$WELCOME_TEXT_HTML</div>
      publicUsers: true

    map:
      enabled: true
      darkStyle: https://api.maptiler.com/maps/ch-swisstopo-lbm/style.json?key=$MAPTILER_KEY
      lightStyle: https://api.maptiler.com/maps/ch-swisstopo-lbm/style.json?key=$MAPTILER_KEY

    metadata:
      faces:
        import: true

    newVersionCheck:
      enabled: false

    nightlyTasks:
      clusterNewFaces: true
      databaseCleanup: true
      generateMemories: true
      missingThumbnails: true
      startTime: "02:30"
      syncQuotaUsage: true
    
    notifications:
      smtp:
        enabled: $EMAIL_ENABLED
        from: $EMAIL_FROM
        replyTo: ""
        transport:
          host: $EMAIL_HOST
          ignoreCert: false
          password: $EMAIL_HOST_PASSWORD
          port: $EMAIL_HOST_PORT
          username: $EMAIL_HOST_USER

    storageTemplate:
      enabled: true
      hashVerificationEnabled: true
      template: "{{#if album}}{{album-startDate-y}}/{{album-startDate-yy}}{{album-startDate-MM}}_{{{album}}}{{else}}{{y}}/_{{yy}}{{MM}}_NoAlbum{{/if}}/{{yy}}{{MM}}{{dd}}{{hh}}{{mm}}_{{filetype}}_{{assetIdShort}}"

    templates:
      email:
        albumInviteTemplate: ""
        albumUpdateTemplate: ""
        welcomeTemplate: ""

    theme:
      customCss: |
        .dark {
          --immich-ui-light: 40 44 52
          --immich-ui-dark: 229 231 235
        }
        :root, .light {
          --immich-ui-dark: 20 22 26
          --immich-ui-light: 240 244 248
        }

    trash:
      days: 30
      enabled: true

    user:
      deleteDelay: 7