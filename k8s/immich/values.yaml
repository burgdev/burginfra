# Default values for Immich
image:
  tag: v1.142.1

# Environment variables for the application
env:
  DB_HOSTNAME: immich-database.immich.svc.cluster.local
  DB_USERNAME:
    valueFrom:
      secretKeyRef:
        name: immich-secrets
        key: username
  DB_PASSWORD:
    valueFrom:
      secretKeyRef:
        name: immich-secrets
        key: password

# Disable built-in PostgreSQL
postgresql:
  enabled: false
  global:
    auth:
      username:
        valueFrom:
          secretKeyRef:
            name: immich-secrets
            key: username
      password:
        valueFrom:
          secretKeyRef:
            name: immich-secrets
            key: password
      database: immich

# Enable Redis
redis:
  enabled: true

# Application configuration
immich:
  persistence:
    library:
      existingClaim: immich-library
